<script>window.SM_DADOS = {"jogos": [{"id": "atividade", "nome": "Cenas de trabalho: o que a análise revela", "curto": "Cenas: a análise", "dur": "9 min", "cor": "#1F4E8C", "corEsc": "#A6C8FF", "desc": "As 8 cenas de trabalho real, agora com perguntas de ergonomia da atividade, SMRT, Psicodinâmica e Saúde do Trabalhador: regulação, desgaste, reconhecimento, processo de trabalho e nexo.", "telas": [{"tipo": "escolha", "cena": "tele", "tag": "Ergonomia da atividade", "sit": "Teleatendimento: 38 clientes na fila, tempo médio cronometrado e 5 minutos de banheiro no dia todo.", "p": "Que leitura a análise do trabalho faz desta cena?", "ops": ["A regulação está bloqueada: o sistema fixa ritmo, tempo e pausas, e a operadora perde a margem de manobra", "Falta treinamento em técnicas de atendimento e de controle emocional", "O risco é só biomecânico (postura e mobiliário), não psicossocial", "A meta de 120 ligações é a causa única: basta reduzi-la"], "certa": 0, "exp": "Na ergonomia da atividade, a saúde depende da margem para regular o próprio trabalho diante da variabilidade. Quando o sistema fixa tempo e pausas, a operadora regula com o próprio corpo e a própria mente. Reduzir a meta ajuda, mas o problema é o desenho do controle, que o Anexo II da NR-17 enfrenta.", "f": ["guerin", "nr17", "guia"]}, {"tipo": "escolha", "cena": "enfermagem", "tag": "SMRT", "sit": "Hospital, 3h40: uma técnica de enfermagem para 14 leitos, no segundo plantão seguido.", "p": "Que forma de desgaste mental, na tipologia de Seligmann-Silva, aparece primeiro?", "ops": ["Desgaste psicofisiológico: fadiga e estresse acumulados pela sobrecarga e pela jornada", "Desgaste literal: dano ao sistema nervoso por agente químico", "Desgaste simbólico, sem relação com a carga de trabalho", "Nenhum: é vulnerabilidade individual ao estresse"], "certa": 0, "exp": "Edith Seligmann-Silva distingue o desgaste literal (dano ao sistema nervoso, como o de solventes), o psicofisiológico (fadiga e estresse) e o simbólico (perda do que dá sentido ao trabalho). Aqui salta o psicofisiológico, mas não poder cuidar bem dos pacientes também produz desgaste simbólico.", "f": ["selig", "guia"]}, {"tipo": "escolha", "cena": "vendas", "tag": "Psicodinâmica do Trabalho", "sit": "Reunião de vendas: ranking do mês na parede e fantasia de tartaruga para o último colocado.", "p": "O que a exposição pública destrói primeiro, na leitura de Dejours?", "ops": ["O reconhecimento e a cooperação: o colega vira concorrente e o esforço vira vergonha", "Só a autoestima de quem ficou em último", "Nada: competição saudável aumenta o engajamento", "A clareza de papéis"], "certa": 0, "exp": "Para Dejours, o reconhecimento (julgamentos de utilidade, pela hierarquia, e de beleza, pelos pares) dá sentido ao sofrimento, e a cooperação depende da confiança entre colegas. A humilhação destrói os dois e empurra para defesas individuais. É assédio organizacional, e não um problema de autoestima.", "f": ["dejours", "cnj351"]}, {"tipo": "escolha", "cena": "entregador", "tag": "Saúde do Trabalhador", "sit": "Entregador de aplicativo, 22h47: 15 segundos para aceitar e aviso de risco de bloqueio.", "p": "Por que a 'autonomia' deste trabalhador é aparente?", "ops": ["O algoritmo define preço, ritmo, avaliação e punição, sem transparência nem negociação coletiva", "Falta a ele formação para gerir o próprio negócio", "Porque trabalha à noite", "Não é aparente: quem escolhe a hora de trabalhar controla o trabalho"], "certa": 0, "exp": "Escolher a hora de entrar no aplicativo não é controlar o trabalho. O processo é organizado pela plataforma, por algoritmo opaco. Baixo controle e baixa justiça organizacional estão na lista do MTE; para a Saúde do Trabalhador, o que importa é como o processo de trabalho é organizado, e não o tipo de contrato.", "f": ["guia", "mendes"]}, {"tipo": "escolha", "cena": "remoto", "tag": "Processo de trabalho", "sit": "Teletrabalho, 23h17: 14 mensagens da equipe pedindo uma tarefa para a manhã seguinte.", "p": "Que leitura a análise do trabalho faz desta cena?", "ops": ["Extensão e intensificação da jornada: as cargas psíquicas avançam sobre o tempo de recuperação e de vida", "Falta de gestão do tempo pela trabalhadora", "Flexibilidade: ela escolheu trabalhar à noite", "Risco ergonômico do mobiliário doméstico"], "certa": 0, "exp": "Laurell e Noriega leem a saúde pelas cargas que o processo de trabalho impõe e pelo desgaste que produzem. A cobrança contínua soma cargas psíquicas e corta a recuperação. A interface trabalho-vida aparece no guia do MTE, na ISO 45003 e no Fórum ABERGO 2026 como fonte de risco. A medida na fonte é limite de contato e prazo dimensionado, combinados com a equipe.", "f": ["laurell", "guia", "lopes"]}, {"tipo": "escolha", "cena": "caixa", "tag": "Hierarquia das medidas", "sit": "Supermercado: cliente grita com a operadora; o fiscal chamado há 10 minutos não aparece.", "p": "Qual medida está na fonte, pela hierarquia da NR-1?", "ops": ["Dimensionar caixas e fiscais pela demanda real e garantir retaguarda imediata", "Treinamento de inteligência emocional para as operadoras", "Acolhimento psicológico depois de cada agressão", "Câmera de vigilância voltada para a operadora"], "certa": 0, "exp": "Acolher depois da agressão é necessário, mas é prevenção secundária. Na fonte estão o efetivo, a organização da fila e a retaguarda. A câmera voltada para a operadora vigia quem sofre a violência, e não quem a pratica.", "f": ["nr1", "who22", "c190"]}, {"tipo": "escolha", "cena": "mudanca", "tag": "Inventário de riscos", "sit": "Escritório: sistema novo na segunda, sem treinamento, com as mesmas metas.", "p": "O que a AEP deveria registrar?", "ops": ["A mudança como perigo, com as circunstâncias (sem treinamento, metas mantidas, sem participação) e os grupos expostos", "Nada, até aparecerem afastamentos", "Os nomes de quem resiste ao sistema novo", "Só a adequação do mobiliário ao novo computador"], "certa": 0, "exp": "O inventário descreve perigos com fontes e circunstâncias e os grupos expostos (NR-1, item 1.5.7.3.2). Esperar o afastamento inverte a prevenção. No estudo de Lopes e De Lucca, depois de uma troca completa da gestão, os casos suspeitos de transtorno mental comum subiram de 10% para 27% em um ano.", "f": ["nr1", "lopes26"]}, {"tipo": "escolha", "cena": "retorno", "tag": "Nexo e direitos", "sit": "Volta do afastamento: mesa no corredor, ao lado do depósito, sem computador e sem tarefas.", "p": "Na volta, o que a Saúde do Trabalhador manda investigar?", "ops": ["Se o adoecimento tem nexo com o trabalho, se cabia CAT e se o retorno está sendo usado para punir", "Só se ela está apta, pelo exame de retorno", "Se há problemas familiares que expliquem o afastamento", "Nada: retorno é assunto do RH"], "certa": 0, "exp": "O isolamento depois da licença é sinal clássico de assédio. Se o adoecimento tem relação com o trabalho, cabe CAT, que o sindicato, o médico ou a própria trabalhadora podem emitir, e o benefício deve ser acidentário (B91), com 12 meses de estabilidade. O exame de retorno não substitui a investigação do nexo.", "f": ["l8213", "cnj351"]}, {"tipo": "info", "tag": "Para fechar", "p": "O que as cenas pedem da ergonomia", "txt": ["Ir além do 'fator': entender como o trabalho é organizado, as margens de regulação, o que o coletivo faz para se defender e o que adoece.", "Para Ana Carolina Peuker (ABERGO 2026), o risco psicossocial está na distância entre o trabalho prescrito e o real.", "Maíra de Cazeto Lopes (Fórum ABERGO 2026) lembra que não basta identificar fatores: é preciso compreender o trabalho que os produz e transformar as condições que os sustentam."], "f": ["peuker", "lopes", "verbete"]}], "nivel": "sst", "nivelNome": "Para ergonomistas e equipes de SST"}, {"id": "aep-aet", "nome": "Da AEP à AET: riscos psicossociais na prática", "curto": "Da AEP à AET", "dur": "9 min", "cor": "#17695F", "corEsc": "#5FD3C2", "desc": "Quando a AET é obrigatória, por que o GHE não serve, que métodos usar, como ler um estudo com JSS e SRQ-20 e quem faz o quê. Com base no Fórum ABERGO 2026.", "telas": [{"tipo": "escolha", "tag": "NR-17, item 17.3.2", "p": "Quando a AET passa a ser obrigatória?", "ops": ["Sempre que a AEP identificar qualquer fator de risco psicossocial", "Quando a AEP pedir avaliação mais aprofundada, as ações forem insuficientes, o PCMSO indicar ou a análise de acidente ou doença apontar causa nas condições de trabalho", "Só em empresas com mais de 100 empregados", "Só quando houver afastamento por CID F"], "certa": 1, "exp": "São as hipóteses do item 17.3.2 da NR-17. A presença de um fator psicossocial, sozinha, não obriga a AET, como reforça o anteprojeto do MTE na AGU. Na prática, risco alto ou crítico na AEP, afastamentos por CID F e M e soluções imediatas inviáveis são indicativos fortes (Lopes, Fórum ABERGO 2026).", "f": ["nr17", "antep", "lopes"]}, {"tipo": "escolha", "tag": "Unidade de análise", "p": "Por que o GHE da higiene ocupacional não serve de ponto de partida para os riscos psicossociais?", "ops": ["Porque esses riscos nascem da organização e da gestão do trabalho, que atravessam funções; não há 'dose' de agente nem limite de tolerância", "Porque a NR-1 proíbe usar GHE", "Porque dependem só da personalidade de cada trabalhador", "Serve: basta usar os mesmos GHEs do ruído"], "certa": 0, "exp": "A organização do trabalho é o ponto de partida, e os resultados vão para o coletivo e as situações de trabalho, sem individualizar a análise (Lopes, Fórum ABERGO 2026). O Observatório Nacional de Saúde Mental do Trabalhador lembra que, aqui, não há limite de tolerância nem EPI.", "f": ["lopes", "obs"]}, {"tipo": "escolha", "tag": "Modelo Operário Italiano", "p": "No Modelo Operário Italiano, o 'grupo homogêneo' é:", "ops": ["Trabalhadores que vivem as mesmas condições e validam juntos o conhecimento sobre o risco", "O mesmo que o GHE da higiene ocupacional, definido por amostragem", "Um grupo de especialistas que avalia os trabalhadores", "Trabalhadores com o mesmo diagnóstico"], "certa": 0, "exp": "Para Oddone e colegas, a experiência operária, validada de forma consensual pelo grupo homogêneo, é fonte de conhecimento, com a regra da não delegação. Daí vêm as rodas de conversa e os grupos que a AET usa hoje. Mesmo nome, outra lógica: o GHE da higiene agrupa exposição; o grupo homogêneo produz conhecimento.", "f": ["oddone", "verbete"]}, {"tipo": "escolha", "tag": "Métodos de coleta", "p": "No quadro do Fórum ABERGO 2026, que métodos entram só na AET?", "ops": ["Entrevistas, rodas de conversa e grupos focais", "Observação em campo", "Conversas informais durante a observação", "Formulários validados, como HSE-IT, COPSOQ e JSS"], "certa": 0, "exp": "Observação, conversas e formulários servem às duas avaliações; entrevistas, rodas e grupos focais aprofundam a AET. Para a Psicologia Social do Trabalho, os métodos coletivos não são complemento: são onde a série vira grupo e o coletivo elabora o que vive.", "f": ["lopes", "sato"]}, {"tipo": "escolha", "tag": "Estudo de caso", "sit": "Indústria do interior de SP, avaliada em 2023 e 2024. Entre as fases, toda a direção e a gerência mudaram. Demanda alta caiu de 42,9% para 35,8%; controle baixo, de 67,1% para 50,7%.", "p": "Os casos suspeitos de transtorno mental comum (SRQ-20) subiram de 10% para 27%. Que dimensão da Job Stress Scale piorou?", "ops": ["Apoio social: baixo em 52,9%, depois em 65,7%", "Demanda", "Controle", "Nenhuma: foi a vida pessoal dos trabalhadores"], "certa": 0, "exp": "O apoio social baixo subiu de 52,9% para 65,7%, e a diferença nos casos suspeitos foi estatisticamente significativa (p = 0,0098). Trocar toda a gestão desmancha relações e apoios: é a má gestão de mudanças, da lista do MTE.", "f": ["lopes26", "lopes", "guia"]}, {"tipo": "escolha", "tag": "Leitura epidemiológica", "p": "O desenho do estudo (transversal repetido) permite dizer que a troca de gestão causou o adoecimento?", "ops": ["Não: mostra a mudança no coletivo entre as fases; a causalidade pede mais elementos, como a análise da atividade e a escuta", "Sim: p menor que 0,05 prova a causa", "Sim, porque são sempre as mesmas pessoas", "Não: estudos com questionário nunca servem"], "certa": 0, "exp": "O valor de p mostra que a diferença dificilmente é acaso, e não qual é a causa. No transversal repetido, as pessoas não são necessariamente as mesmas nas duas fases. O estudo completou os números com entrevistas feitas depois da observação do trabalho real, e é essa combinação que sustenta conclusões para a ação.", "f": ["lopes26"]}, {"tipo": "ordenar", "tag": "Etapas da AEP", "p": "Ponha as etapas da AEP na ordem", "ops": ["Caracterizar a organização e os processos", "Identificar as demandas organizacionais", "Observar as atividades e escutar os trabalhadores", "Identificar situações críticas e grupos expostos", "Registrar os perigos e classificar os riscos"], "certa": [0, 1, 2, 3, 4], "exp": "Sequência apresentada no Fórum ABERGO 2026, a partir do item 17.3.1 da NR-17 e do guia do MTE. Atendimentos ambulatoriais, canal de denúncia, ações trabalhistas e afastamentos ajudam a calibrar probabilidade e severidade.", "f": ["lopes", "nr17"]}, {"tipo": "escolha", "tag": "Da fonte para o indivíduo", "p": "Qual destas é prevenção primária, na fonte?", "ops": ["Metas e efetivo compatíveis com a demanda real", "Capacitação das lideranças em comunicação", "Acolhimento e encaminhamento", "Retorno ao trabalho planejado"], "certa": 0, "exp": "Acolher e planejar o retorno são prevenção secundária e terciária. Capacitar lideranças ajuda, mas não muda meta nem efetivo. A prioridade, para a OMS e para a NR-1, é a prevenção primária, na origem do risco.", "f": ["who22", "nr1", "lopes"]}, {"tipo": "escolha", "tag": "Debate", "p": "Até onde vai a atuação do ergonomista, e onde entra a do psicólogo?", "ops": ["O ergonomista conduz AEP e AET; o psicólogo apoia com instrumentos e escuta", "Equipe multiprofissional, com coordenação compartilhada", "O psicólogo conduz a parte psicossocial", "Os trabalhadores e seus representantes no centro, com a equipe técnica a serviço"], "certa": null, "exp": "Não há resposta certa: é o debate que o Fórum ABERGO 2026 propôs. A NR-1 e a NR-17 não exigem uma profissão (MTE). A Resolução CFP 14/2023 regula o trabalho da Psicologia nessa avaliação. Na tradição da Saúde do Trabalhador, desde o Modelo Operário Italiano, os trabalhadores são sujeitos da análise, e não objeto dela.", "f": ["lopes", "pr", "cfp", "oddone"]}], "nivel": "sst", "nivelNome": "Para ergonomistas e equipes de SST"}, {"id": "iso45003", "nome": "ISO 45003 com olhar crítico", "curto": "ISO 45003", "dur": "9 min", "cor": "#5B3FA0", "corEsc": "#C9B8FF", "desc": "O que a norma é e o que não é, a evidência sobre intervenções, Schilling e burnout, dados e LGPD, acolhedores emocionais e segurança psicológica. Com base na ABERGO 2026.", "telas": [{"tipo": "escolha", "tag": "Estatuto da norma", "p": "A ISO 45003 é obrigatória para as empresas no Brasil?", "ops": ["Não: é norma técnica voluntária, de diretrizes; a obrigação legal está na NR-1 e na NR-17", "Sim, desde a Portaria MTE 1.419/2024", "Sim, para quem tem PGR", "Só para quem tem a ISO 45001"], "certa": 0, "exp": "A ISO 45003:2021 traz diretrizes para gerir riscos psicossociais junto com a ISO 45001, que tem os requisitos. Não substitui a norma regulamentadora nem cria obrigação legal; a ABNT discute a versão brasileira (CEE-109).", "f": ["iso", "peuker"]}, {"tipo": "escolha", "tag": "Certificação", "p": "Dá para certificar uma empresa na ISO 45003?", "ops": ["Não: ela é guia de diretrizes; a certificação é do sistema de gestão, pela ISO 45001", "Sim, como a ISO 9001", "Sim, se usar um questionário validado", "Sim, pelo Ministério do Trabalho"], "certa": 0, "exp": "A ISO 45003 é um documento de orientação, sem requisitos certificáveis. Selo de 'empresa certificada em saúde mental pela ISO 45003' merece desconfiança.", "f": ["iso"]}, {"tipo": "escolha", "tag": "A água e o peixe", "p": "'Se o lago está tóxico, trata-se a água, não o peixe.' A água é:", "ops": ["O desenho do trabalho: conteúdo, organização das tarefas e dos papéis e o contexto", "A resiliência dos trabalhadores", "O clima entre colegas", "O programa de benefícios"], "certa": 0, "exp": "A metáfora, citada por Ana Carolina Peuker na ABERGO 2026, resume a prioridade da norma: mudar a fonte antes de cuidar de quem adoece. A Saúde do Trabalhador acrescenta: quem conhece a água é quem nada nela, e o desenho se muda com os trabalhadores.", "f": ["peuker", "iso"]}, {"tipo": "escolha", "tag": "Evidência", "p": "Num estudo com 46 mil trabalhadores de 233 organizações, quem fez só intervenções individuais (mindfulness, resiliência, aplicativos):", "ops": ["Não estava melhor do que quem não fez", "Teve metade dos afastamentos", "Melhorou só no primeiro mês", "Piorou muito"], "certa": 0, "exp": "É o estudo de William Fleming (2024). Já a revisão de 52 revisões de Aust e colegas (2023) achou benefício em mudar jornadas e dar influência sobre o trabalho. A evidência confirma a ordem da NR-1: primeiro a organização do trabalho.", "f": ["fleming", "aust"]}, {"tipo": "escolha", "tag": "Jornada", "p": "Trabalhar 55 horas ou mais por semana aumenta o risco de AVC em:", "ops": ["35%", "5%", "Não aumenta: o efeito é só no humor", "200%"], "certa": 0, "exp": "Estimativa conjunta da OMS e da OIT (Pega e colegas, 2021): 35% a mais de risco de AVC e 17% a mais de doença isquêmica do coração. Jornada é organização do trabalho, e o corpo também adoece de sobrecarga.", "f": ["pega"]}, {"tipo": "escolha", "tag": "Schilling e burnout", "p": "Na ABERGO 2026, ouviu-se que, em transtornos mentais, o trabalho costuma contribuir ou agravar (Schilling II e III). E o burnout?", "ops": ["Grupo I: a OMS o define como resultado do estresse crônico no trabalho, só no contexto ocupacional", "Grupo III: o trabalho só agrava o que já existia", "Fora da classificação: não tem relação com o trabalho", "Grupo II: o trabalho é um fator entre vários, nunca necessário"], "certa": 0, "exp": "No grupo I de Schilling, o trabalho é causa necessária. Como a própria OMS restringe o burnout (QD85, na CID-11) ao contexto do trabalho, ele se encaixa ali, como sustentam Bruno Chapadeiro e Cirlene Zimmermann. Para depressão e ansiedade, os grupos II e III são o mais comum, e a LDRT e o NTEP ajudam a reconhecer o nexo.", "f": ["cid11", "ms2001", "zimmermann", "peuker"]}, {"tipo": "escolha", "tag": "Dados e LGPD", "p": "Pela LGPD, os dados de saúde mental usados no PGR são:", "ops": ["Dados pessoais sensíveis: na gestão, só agregados e anonimizados", "Dados comuns, de livre uso pelo RH", "Dados públicos", "Da empresa que pagou o questionário"], "certa": 0, "exp": "A LGPD trata dado de saúde como sensível (arts. 5º e 11). O MTE pede anonimato, e a ABERGO 2026 reforçou: dado individual só entra agregado, nunca para culpar quem trabalha. Com ou sem inteligência artificial, quem decide é a equipe técnica, com os trabalhadores.", "f": ["lgpd", "manual", "peuker"]}, {"tipo": "escolha", "tag": "Acolhedores emocionais", "p": "Colegas treinados como 'acolhedores emocionais' são prevenção de que nível?", "ops": ["Secundária: acolhem e encaminham quem já sofre", "Primária: eliminam a fonte do risco", "Terciária: cuidam só do retorno", "Não são prevenção"], "certa": 0, "exp": "Acolher cedo e encaminhar bem é importante e reduz o estigma. Mas é prevenção secundária: não muda metas, jornadas nem o jeito de gerir. Sem medidas na fonte, é cuidar do peixe e deixar a água tóxica.", "f": ["who22", "peuker"]}, {"tipo": "escolha", "tag": "Segurança psicológica", "p": "Segurança psicológica, para Amy Edmondson, é:", "ops": ["A crença compartilhada na equipe de que é seguro assumir riscos interpessoais, como errar ou discordar", "A ausência de qualquer risco psicossocial", "Um traço de personalidade", "Um seguro de saúde mental"], "certa": 0, "exp": "O conceito (Edmondson, 1999) é de equipe, e não de indivíduo. A ABERGO 2026 lembrou o custo de dizer 'não vou dar conta'. Para a Saúde do Trabalhador, segurança psicológica não substitui o poder coletivo de negociar o trabalho.", "f": ["edmondson", "peuker"]}], "nivel": "sst", "nivelNome": "Para ergonomistas e equipes de SST"}, {"id": "nexo", "nome": "Nexo, notificação e direitos", "curto": "Nexo e direitos", "dur": "8 min", "cor": "#B3261E", "corEsc": "#FF8F84", "desc": "Schilling, CAT, NTEP, B91, notificação no Sinan, Cerest e LDRT: o que a ergonomia precisa saber quando o trabalho já adoeceu.", "telas": [{"tipo": "escolha", "tag": "Schilling", "p": "Na classificação de Schilling, o grupo I reúne agravos em que o trabalho é:", "ops": ["Causa necessária", "Fator contributivo, mas não necessário", "Provocador de distúrbio latente ou agravante de doença já existente", "Sem relação"], "certa": 0, "exp": "Grupo I: causa necessária, como na silicose. Grupo II: fator contributivo, como na doença coronariana. Grupo III: provocador ou agravante, como em muitos transtornos mentais. O Ministério da Saúde adota a classificação desde 2001.", "f": ["ms2001"]}, {"tipo": "escolha", "tag": "CAT", "p": "A empresa se recusa a emitir a CAT de um transtorno mental relacionado ao trabalho. Quem pode emitir?", "ops": ["O próprio trabalhador, os dependentes, o sindicato, o médico que o atendeu ou qualquer autoridade pública", "Ninguém: só a empresa", "Só o médico do trabalho da empresa", "Só a Justiça do Trabalho"], "certa": 0, "exp": "É o que diz a Lei 8.213/1991, art. 22, § 2º, sem prazo para essa comunicação. A doença do trabalho equipara-se a acidente de trabalho (art. 20).", "f": ["l8213"]}, {"tipo": "escolha", "tag": "NTEP", "p": "O que faz o nexo técnico epidemiológico previdenciário (NTEP)?", "ops": ["Presume o nexo quando há associação estatística entre a doença (CID) e a atividade da empresa (CNAE); a empresa pode contestar", "Exige laudo psicológico em todo afastamento", "Proíbe afastamento por transtorno mental", "Classifica o trabalhador por risco"], "certa": 0, "exp": "Criado pela Lei 11.430/2006 (art. 21-A da Lei 8.213/1991), o NTEP inverte o ônus da prova: o INSS presume o nexo, e cabe à empresa demonstrar o contrário.", "f": ["ntep", "l8213"]}, {"tipo": "escolha", "tag": "B91 ou B31", "p": "Qual a diferença prática entre o benefício acidentário (B91) e o previdenciário comum (B31)?", "ops": ["O B91 dá 12 meses de estabilidade depois da alta e mantém o depósito do FGTS", "Nenhuma", "O B31 paga mais", "O B91 só vale para lesão física"], "certa": 0, "exp": "Reconhecido o nexo, o benefício é acidentário: estabilidade de 12 meses (Lei 8.213/1991, art. 118) e FGTS durante o afastamento (Lei 8.036/1990). Por isso o enquadramento importa tanto.", "f": ["l8213", "l8036"]}, {"tipo": "escolha", "tag": "Vigilância", "p": "Desde 2024, os transtornos mentais relacionados ao trabalho são:", "ops": ["De notificação compulsória, semanal, em serviços públicos e privados", "Notificados só em unidades sentinela", "Notificados só se houver CAT", "Não são notificados"], "certa": 0, "exp": "A Portaria GM/MS 5.201/2024 incluiu os transtornos mentais relacionados ao trabalho na lista nacional de notificação compulsória (Sinan). A notificação não depende da CAT e alimenta a vigilância em saúde do trabalhador, que a ergonomia pode usar como indicador.", "f": ["notif"]}, {"tipo": "escolha", "tag": "Rede do SUS", "p": "No SUS, quem dá retaguarda técnica para investigar o nexo e fazer vigilância dos ambientes de trabalho?", "ops": ["O Cerest, da Renast", "O CAPS", "O INSS", "O SESMT da empresa"], "certa": 0, "exp": "Os Centros de Referência em Saúde do Trabalhador (Cerest), da Renast, apoiam a rede, investigam o nexo e fazem vigilância de processos e ambientes, como prevê a Política Nacional de Saúde do Trabalhador e da Trabalhadora (2012). O CAPS cuida do tratamento em saúde mental.", "f": ["pnstt"]}, {"tipo": "escolha", "tag": "Como se faz o nexo", "p": "Para a Saúde do Trabalhador, o nexo de um transtorno mental com o trabalho se estabelece principalmente por:", "ops": ["História do trabalho e da vida, análise do processo de trabalho e dados do coletivo, com a palavra do trabalhador", "Teste psicológico de personalidade", "Exame de imagem do cérebro", "Ausência de problemas familiares"], "certa": 0, "exp": "O nexo é clínico, epidemiológico e social: anamnese ocupacional, como o trabalho é organizado, o que acontece com os colegas (padrão no grupo, tempo, exposição) e os dados de saúde. Procurar uma 'causa fora' é a lógica monocausal que Leny Sato descreveu como defesa e que culpa quem adoece.", "f": ["ms2001", "peuker", "sato"]}, {"tipo": "escolha", "tag": "LDRT", "p": "O que fez a atualização de 2023 da Lista de Doenças Relacionadas ao Trabalho?", "ops": ["Passou de 182 para 347 códigos e ampliou os transtornos mentais relacionados ao trabalho", "Tirou os transtornos mentais da lista", "Passou a exigir CAT para todo diagnóstico", "Vale só para servidores públicos"], "certa": 0, "exp": "A Portaria GM/MS 1.999/2023 atualizou a lista de 1999, com burnout, ansiedade e depressão entre os agravos, e listou os fatores de risco psicossociais; nova atualização veio em 2024 (Portaria GM/MS 5.674). A lista orienta o SUS e a Previdência no reconhecimento do nexo.", "f": ["ldrt"]}, {"tipo": "info", "cena": "retorno", "tag": "Apoio", "p": "Quando o trabalho já adoeceu", "txt": ["O Caminhos do Trabalho UFF, projeto de extensão coordenado por Bruno Chapadeiro em Volta Redonda (RJ), atende trabalhadores adoecidos: análise do nexo, CAT, orientação previdenciária e jurídica e acolhimento psicológico.", "Procure o projeto pelo WhatsApp ou pelo Instagram @caminhosdotrabalhouff."], "f": ["caminhos"]}], "nivel": "sst", "nivelNome": "Para ergonomistas e equipes de SST"}, {"id": "pensamento", "nome": "Quem pensou isso? STT, SMRT, PST e ergonomia", "curto": "Quem pensou isso?", "dur": "8 min", "cor": "#7A4A12", "corEsc": "#F0B05A", "desc": "Mendes e Dias, Laurell e Noriega, Seligmann-Silva, Dejours, Sato, Oddone: as ideias que mudaram o olhar sobre o sofrimento no trabalho, e a crítica ao 'fator de risco'.", "telas": [{"tipo": "escolha", "tag": "Saúde do Trabalhador", "p": "'Da medicina do trabalho à saúde do trabalhador' (1991): que virada esse texto marca?", "ops": ["O trabalhador passa de objeto a sujeito, e o foco vai do indivíduo ao processo de trabalho", "A troca do médico pelo engenheiro de segurança", "O fim da medicina do trabalho", "A criação da ergonomia"], "certa": 0, "exp": "René Mendes e Elizabeth Costa Dias mostram a passagem da Medicina do Trabalho e da Saúde Ocupacional, centradas no ajuste do trabalhador e no controle de agentes, para a Saúde do Trabalhador, que olha o processo de trabalho com os trabalhadores como sujeitos.", "f": ["mendes", "lacaz"]}, {"tipo": "escolha", "tag": "Medicina social", "p": "Quem propôs ler a saúde pelas cargas de trabalho e pelo desgaste do processo de produção?", "ops": ["Asa Cristina Laurell e Mariano Noriega", "Robert Karasek", "Christophe Dejours", "Johannes Siegrist"], "certa": 0, "exp": "Em 'Processo de produção e saúde' (1989), Laurell e Noriega, da medicina social latino-americana, ligam cargas físicas, químicas, biológicas, mecânicas, fisiológicas e psíquicas ao desgaste, como processo coletivo e histórico.", "f": ["laurell"]}, {"tipo": "escolha", "tag": "SMRT", "p": "Desgaste literal, psicofisiológico e simbólico: de quem é essa distinção?", "ops": ["Edith Seligmann-Silva", "Leny Sato", "Christina Maslach", "François Guérin"], "certa": 0, "exp": "Edith Seligmann-Silva, referência da Saúde Mental Relacionada ao Trabalho no Brasil, em 'Trabalho e desgaste mental' (2011).", "f": ["selig"]}, {"tipo": "escolha", "tag": "Psicodinâmica do Trabalho", "p": "Para Dejours, o que transforma o sofrimento no trabalho em prazer?", "ops": ["O reconhecimento, pela hierarquia e pelos pares", "O salário", "A ausência de esforço", "A personalidade resiliente"], "certa": 0, "exp": "O reconhecimento (julgamentos de utilidade e de beleza) dá sentido ao sofrimento. Quando falta, crescem as estratégias defensivas, que protegem e também calam.", "f": ["dejours"]}, {"tipo": "escolha", "tag": "Psicologia Social do Trabalho", "p": "A distinção entre 'série' e 'grupo', usada por Leny Sato em atividades com portadores de LER, serve para:", "ops": ["Diferenciar pessoas apenas reunidas de um coletivo que elabora junto a experiência e age sobre ela", "Classificar pacientes por gravidade", "Montar escalas de turno", "Separar trabalhadores por função"], "certa": 0, "exp": "No artigo de 1993 na Revista Brasileira de Saúde Ocupacional, Sato e colegas mostram o grupo como lugar de elaboração coletiva e criticam o uso do 'psicológico' para culpar quem adoece.", "f": ["sato"]}, {"tipo": "escolha", "tag": "Modelo Operário Italiano", "p": "'Validação consensual' e 'não delegação' são princípios de:", "ops": ["Modelo Operário Italiano", "ISO 45003", "Segurança baseada em comportamento", "Teoria do ato inseguro"], "certa": 0, "exp": "Ivar Oddone e colegas, nos anos 1970: o conhecimento sobre os riscos é validado pelo grupo de trabalhadores, que não delega a defesa da própria saúde. Inspirou a Saúde do Trabalhador brasileira.", "f": ["oddone"]}, {"tipo": "escolha", "tag": "Crítica do 'fator'", "p": "Que crítica a Saúde do Trabalhador faz à noção de 'fator de risco'?", "ops": ["Vem da História Natural da Doença e tende a isolar fatores e individualizar, perdendo o processo de trabalho e a determinação social", "É moderna demais", "Não tem base estatística", "Nenhuma: são sinônimos"], "certa": 0, "exp": "O verbete de Bruno Chapadeiro para o Dicionário de Ergonomia retoma Moreno-Jiménez, Leavell e Clark e Breilh e propõe falar em processos biopsicossociais relacionados ao trabalho: o trabalho como mediação coletiva e histórica, com manifestações individuais.", "f": ["verbete"]}, {"tipo": "escolha", "tag": "Ato inseguro", "p": "'Ato inseguro' e 'segurança baseada em comportamento' são criticados porque:", "ops": ["Põem a causa no comportamento de quem trabalha e deixam a organização do trabalho de fora", "São recentes demais", "Exigem muitos equipamentos", "Valorizam a participação dos trabalhadores"], "certa": 0, "exp": "Jackson Filho e colegas (2013) chamam o ato inseguro de conceito inaceitável. O mesmo raciocínio volta quando a 'falta de resiliência' vira explicação para o adoecimento mental.", "f": ["verbete"]}, {"tipo": "ordenar", "tag": "Linha do tempo", "p": "Ponha em ordem cronológica", "ops": ["Freudenberger descreve o burnout", "Dejours publica 'Travail: usure mentale'", "Mendes e Dias: da medicina do trabalho à saúde do trabalhador", "ISO 45003"], "certa": [0, 1, 2, 3], "exp": "1974, 1980, 1991 e 2021. A linha do tempo completa está na página dos jogos.", "f": ["mendes", "iso"]}], "nivel": "sst", "nivelNome": "Para ergonomistas e equipes de SST"}, {"id": "pratica", "nome": "Termômetro da prática em SST", "curto": "Termômetro da prática", "dur": "8 min", "cor": "#34306B", "corEsc": "#B7B1F2", "ao_vivo": true, "desc": "Para ergonomistas e equipes de SST responderem sobre a própria prática: escuta, dados, independência técnica, métodos coletivos e equipe. Anônimo, com nuvens de palavras.", "telas": [{"tipo": "info", "cena": "roda", "tag": "Antes de começar", "p": "Um retrato da prática, sem nome de ninguém", "txt": ["Responda sobre o seu trabalho como ergonomista ou profissional de SST. É anônimo, e o telão só mostra cada resultado a partir de 5 respostas.", "Quem avalia o trabalho também trabalha sob pressão, metas e prazos."], "f": []}, {"tipo": "nuvem", "tag": "Nuvem de palavras", "p": "Em uma palavra: o que mais dificulta avaliar riscos psicossociais hoje?", "ex": "ex.: tempo", "exp": "As palavras que se repetem mostram os entraves da categoria, e não de uma pessoa só.", "f": []}, {"tipo": "escala", "tag": "Escuta", "p": "Nas suas AEPs, os trabalhadores são ouvidos de verdade?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "A NR-17 garante que os trabalhadores sejam ouvidos na AEP e na AET (item 17.3.8), e o MTE afirma que não há avaliação válida sem a voz deles.", "f": ["nr17", "manual"]}, {"tipo": "escala", "tag": "Dados", "p": "Você tem acesso aos dados de afastamento, CAT e PCMSO para calibrar a avaliação?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "O MTE recomenda reunir afastamentos, CAT e indicadores do PCMSO na preparação, e o Fórum ABERGO 2026 usa esses dados para calibrar probabilidade e severidade.", "f": ["guia", "lopes"]}, {"tipo": "escala", "tag": "Efetividade", "p": "Suas recomendações sobre metas, efetivo e jornada viram medida no plano de ação?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Sem isso, a avaliação fica no papel. O plano de ação da NR-1 precisa de cronograma, responsáveis e acompanhamento.", "f": ["nr1"]}, {"tipo": "escala", "tag": "Independência", "p": "Você já sofreu pressão para classificar um risco psicossocial como baixo?", "ops": ["Nunca", "Uma vez", "Algumas vezes", "Muitas vezes"], "alerta": [1, 2, 3], "exp": "Independência técnica é condição da prevenção. A NR-1 exige critérios de avaliação documentados e transparentes (item 1.5.4.4.2.2).", "f": ["nr1"]}, {"tipo": "escala", "tag": "Métodos coletivos", "p": "Você usa métodos coletivos, como rodas, grupos e validação com os trabalhadores?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Do Modelo Operário Italiano às rodas de conversa da AET, o coletivo produz conhecimento sobre o risco, e a série vira grupo.", "f": ["oddone", "sato", "lopes"]}, {"tipo": "escala", "tag": "Equipe", "p": "Você conta com equipe multiprofissional (ergonomia, psicologia, medicina, enfermagem)?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "O MTE recomenda abordagem multidisciplinar, e a ISO 45003 fala em competência e trabalho interdisciplinar.", "f": ["manual", "iso"]}, {"tipo": "nuvem", "tag": "Nuvem de palavras", "p": "Em uma palavra: o que você mudaria primeiro na sua prática?", "ex": "ex.: escuta", "exp": "Este é o começo de uma pauta coletiva da categoria.", "f": []}, {"tipo": "info", "tag": "E agora?", "p": "Do retrato à pauta", "txt": ["Leve o resultado para a sua equipe e para o Comitê Técnico de Saúde Mental e Riscos Psicossociais da ABERGO.", "Para continuar a conversa, siga @brunochapadeiro no Instagram e conheça o Caminhos do Trabalho UFF."], "f": []}], "nivel": "sst", "nivelNome": "Para ergonomistas e equipes de SST"}, {"id": "central", "nome": "Caso para decidir: a central que adoece", "curto": "Caso: a central", "dur": "10 min", "cor": "#9A5F0C", "corEsc": "#F0B05A", "desc": "Um caso para equipes de SST: da escolha do método à matriz de risco, do plano de ação ao retorno de quem se afastou, e um debate sobre a matriz de probabilidade e severidade.", "telas": [{"tipo": "info", "cena": "tele", "tag": "O caso (fictício)", "p": "A central que adoece", "txt": ["Uma central de atendimento com 400 operadores: tempo médio cronometrado, pausas controladas pelo sistema e metas que mudam toda semana.", "Em um ano, 38 afastamentos por transtorno mental (CID F) e 21 por doença osteomuscular (CID M). Vocês são a equipe de SST."], "f": []}, {"tipo": "escolha", "tag": "Passo 1", "p": "Por onde começa a AEP?", "ops": ["Caracterizar a organização e os processos e observar a atividade real, com escuta, antes de qualquer questionário", "Aplicar um questionário validado a todos e ranquear setores", "Avaliar psicologicamente os afastados", "Pedir à liderança a lista dos 'problemáticos'"], "certa": 0, "exp": "Para o MTE, a análise da organização do trabalho é o ponto de partida obrigatório, e questionário sozinho não basta. O Fórum ABERGO 2026 começa a AEP pela caracterização da organização e pela escuta.", "f": ["manual", "pr", "lopes"]}, {"tipo": "escolha", "tag": "Passo 2", "p": "Os afastamentos por CID F e M, juntos, indicam:", "ops": ["Adoecimento instalado: indicativo de AET e de investigação de nexo, com CAT quando couber", "Problema individual, fora do PGR", "Nada, sem questionário", "Que é preciso trocar os operadores"], "certa": 0, "exp": "Afastamentos por CID F e M são indicativos de AET (Lopes, Fórum ABERGO 2026; NR-17, item 17.3.2). Se há relação com o trabalho, a CAT pode ser emitida também pelo sindicato ou pelo próprio trabalhador.", "f": ["lopes", "nr17", "l8213"]}, {"tipo": "escolha", "tag": "Passo 3", "p": "O questionário mostra 'controle baixo' para 70% dos operadores. Qual a leitura certa?", "ops": ["Um dado do coletivo, que a análise da atividade e a escuta precisam explicar: o que, no trabalho, tira o controle?", "70% têm perfil psicológico frágil", "Basta um treinamento de autonomia", "O dado prova sozinho o nexo de cada caso"], "certa": 0, "exp": "Formulário validado é leitura quantitativa do coletivo (Fórum ABERGO 2026). O sinal que se repete no grupo aponta para o trabalho, mas o 'porquê' está na atividade: TMA, roteiro, monitoramento, pausas.", "f": ["lopes", "peuker"]}, {"tipo": "escolha", "tag": "Passo 4", "p": "A empresa quer classificar o risco como 'baixo' porque 'ninguém morreu'. O que pesa na severidade?", "ops": ["A magnitude dos agravos e o número de trabalhadores atingidos, incluindo os afastamentos já ocorridos", "Só óbitos", "A opinião da diretoria", "O custo das medidas"], "certa": 0, "exp": "A NR-1 manda considerar a magnitude da consequência e o número de trabalhadores possivelmente afetados (item 1.5.4.4.3), com critérios documentados. Afastamento já ocorrido é agravo, e não hipótese.", "f": ["nr1"]}, {"tipo": "escolha", "tag": "Passo 5", "p": "Que medida vai primeiro no plano de ação?", "ops": ["Rever tempo médio e metas com os operadores, devolver o controle das pausas e dimensionar o efetivo pela demanda real", "Sala de descompressão com videogame", "Programa de mindfulness", "Prêmio de assiduidade"], "certa": 0, "exp": "Mudar a organização do trabalho é o que funciona (Fleming, 2024; Aust e colegas, 2023) e é a ordem da NR-1. Prêmio de assiduidade empurra gente doente para o trabalho.", "f": ["fleming", "aust", "nr1"]}, {"tipo": "escolha", "tag": "Passo 6", "p": "Um operador volta de licença acidentária (B91) por depressão. O que a equipe faz?", "ops": ["Retorno planejado com ele, ajuste de tarefas e metas, estabilidade respeitada e acompanhamento no PCMSO", "Mudá-lo de função sem conversar", "As mesmas metas desde o primeiro dia", "Preparar a demissão para depois da estabilidade"], "certa": 0, "exp": "Retorno é prevenção terciária e precisa de planejamento com a pessoa. O B91 garante 12 meses de estabilidade (Lei 8.213/1991, art. 118). Repetir as mesmas metas é devolvê-lo ao que o adoeceu.", "f": ["l8213", "who22"]}, {"tipo": "escolha", "tag": "Passo 7", "p": "Seis meses depois: como avaliar a eficácia?", "ops": ["Ver se a exposição diminuiu (tempo médio, pausas efetivas, horas extras, afastamentos, queixas), com os operadores e a CIPA, e revisar o inventário", "Pesquisa de satisfação com o programa de bem-estar", "Contar quantos fizeram o curso", "Ver se o índice de atendimento subiu"], "certa": 0, "exp": "A ISO 45003 (seções 9 e 10) e a NR-1 (item 1.5.4.4.6) pedem verificar se a exposição diminuiu e revisar a avaliação. Participação em curso mede atividade, e não prevenção.", "f": ["iso", "nr1", "peuker"]}, {"tipo": "escolha", "tag": "Debate", "p": "A matriz de probabilidade × severidade serve para riscos psicossociais?", "ops": ["Sim, como para os demais riscos", "Sim, com critérios qualitativos e a participação dos trabalhadores", "Não: esses riscos pedem outra lógica de avaliação", "Não sei"], "certa": null, "exp": "Não há resposta certa. A NR-1 pede um nível de risco para cada risco (item 1.5.4.4.2) e deixa a escolha do método à organização. O Observatório Nacional de Saúde Mental do Trabalhador critica encaixar esses riscos numa matriz quantitativa, porque todos estão expostos e não há limite de tolerância nem EPI. O MTE admite avaliação qualitativa pela NR-17, e o anteprojeto na AGU mantém a liberdade metodológica.", "f": ["nr1", "obs", "guia", "antep"]}], "nivel": "sst", "nivelNome": "Para ergonomistas e equipes de SST"}, {"id": "cenas", "nome": "Isso adoece? Cenas de trabalho", "curto": "Cenas de trabalho", "dur": "8 min", "cor": "#1F4E8C", "corEsc": "#A6C8FF", "desc": "Oito cenas ilustradas de trabalho real: telemarketing, hospital, aplicativo, home office, supermercado. Qual é o fator de risco em cada uma?", "telas": [{"tipo": "escolha", "cena": "tele", "tag": "Teleatendimento", "sit": "Central de atendimento: 38 clientes na fila, 5 minutos por ligação no relógio e 5 minutos de banheiro no dia todo.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Falta de controle sobre o próprio ritmo e as pausas", "Ela não sabe lidar com pressão", "Pouco trabalho para fazer", "Nenhum: todo call center é assim"], "certa": 0, "exp": "O sistema decide o ritmo, o tempo de cada ligação e até a ida ao banheiro. Baixo controle e falta de autonomia estão na lista de fatores de risco do MTE, ligados a transtorno mental e a DORT. A NR-17 tem um anexo só para o teleatendimento, que garante pausas e a saída do posto para ir ao banheiro a qualquer hora, sem prejuízo na avaliação.", "f": ["guia", "nr17"]}, {"tipo": "escolha", "cena": "enfermagem", "tag": "Hospital", "sit": "Hospital, 3h40: uma técnica de enfermagem para 14 leitos, no segundo plantão seguido, com três pacientes chamando ao mesmo tempo.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Excesso de demandas e jornada longa", "Falta de vocação para a enfermagem", "Pouca clareza sobre a função", "Nenhum: plantão é assim mesmo"], "certa": 0, "exp": "Gente de menos para trabalho demais, emendando plantões: é a sobrecarga, que o MTE liga a transtorno mental e a DORT. Não é falta de vocação. A medida que ataca a fonte é dimensionar a equipe e limitar a jornada, e não pedir mais esforço a quem já está no limite.", "f": ["guia"]}, {"tipo": "escolha", "cena": "vendas", "tag": "Vendas", "sit": "Reunião de vendas: o ranking do mês fica na parede, e o gerente manda o último colocado vestir a fantasia de tartaruga na frente de todos.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Assédio moral: humilhar quem não bate a meta", "Uma brincadeira para motivar a equipe", "Falta de talento para vendas", "Pouca clareza sobre a função"], "certa": 0, "exp": "Expor e ridicularizar quem não bate a meta é assédio moral: conduta que fere a dignidade e degrada o ambiente de trabalho. Quando vira método de gestão, é assédio organizacional. Assédio de qualquer natureza é o primeiro item da lista de fatores de risco psicossociais do MTE.", "f": ["guia", "cnj351"]}, {"tipo": "escolha", "cena": "entregador", "tag": "Aplicativo", "sit": "Entregador de aplicativo, 22h47, na chuva: o celular dá 15 segundos para aceitar a corrida e avisa que a taxa de aceitação caiu e que ele pode ser bloqueado.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Controle por algoritmo e ameaça de bloqueio sem explicação", "Ele é lento e desorganizado", "Trabalho com pouca demanda", "Nenhum: é autônomo e faz o próprio horário"], "certa": 0, "exp": "Quem decide o ritmo é o aplicativo, com prazo de segundos e punição sem explicação. São dois fatores da lista do MTE: baixo controle no trabalho e baixa justiça organizacional. Chamar de “autônomo” não tira o risco, que está no jeito como o trabalho é organizado.", "f": ["guia"]}, {"tipo": "escolha", "cena": "remoto", "tag": "Teletrabalho", "sit": "Teletrabalho, 23h17: 14 mensagens no grupo da equipe pedindo uma tarefa para a manhã seguinte.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Jornada sem fim: cobrança fora do horário", "Ela não sabe se organizar", "Trabalho remoto é sempre mais leve", "Nenhum: é só responder amanhã"], "certa": 0, "exp": "Mensagem de trabalho às 23h vira hora extra invisível e tira o descanso. Trabalho remoto e isolado está na lista de fatores de risco do MTE, ligado a transtorno mental e a fadiga. A saída é coletiva: combinar horários de contato e prazos possíveis, em vez de esperar que cada um se desconecte sozinho.", "f": ["guia"]}, {"tipo": "escolha", "cena": "caixa", "tag": "Supermercado", "sit": "Supermercado: fila de 12 pessoas, um cliente grita com a operadora de caixa, e o fiscal chamado há 10 minutos não aparece.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Violência de cliente, sem apoio da empresa", "Ela deveria ter mais paciência", "Autonomia demais", "Nenhum: o cliente tem sempre razão"], "certa": 0, "exp": "Agressão de cliente é violência no trabalho, e ficar sozinha diante dela é falta de apoio: os dois estão na lista do MTE (eventos violentos e falta de suporte). A Convenção 190 da OIT, que está no Congresso, inclui a violência de clientes e do público. Prevenir é ter gente suficiente, apoio na hora e registro de cada caso.", "f": ["guia", "c190"]}, {"tipo": "escolha", "cena": "mudanca", "tag": "Escritório", "sit": "Escritório: um comunicado avisa que o sistema muda na segunda, sem treinamento, e que as metas continuam as mesmas.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Mudança imposta, sem preparo e sem participação", "Resistência das pessoas à tecnologia", "Pouco trabalho para fazer", "Nenhum: mudar faz parte"], "certa": 0, "exp": "Mudar não adoece por si. Adoece mudar de cima para baixo, sem treinamento, sem ajustar a meta e sem ouvir quem faz o trabalho. “Má gestão de mudanças organizacionais” está na lista do MTE. Chamar isso de resistência joga o problema nas costas de quem trabalha.", "f": ["guia"]}, {"tipo": "escolha", "cena": "retorno", "tag": "Retorno ao trabalho", "sit": "Volta do afastamento: a trabalhadora ganha uma mesa no corredor, ao lado do depósito, sem computador, sem tarefas e longe da equipe.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Isolamento e esvaziamento das tarefas: assédio", "Cuidado para ela se recuperar aos poucos", "Excesso de demandas", "Nenhum: não havia outra mesa"], "certa": 0, "exp": "Tirar as tarefas, isolar e esconder a pessoa é uma forma conhecida de assédio moral, muitas vezes para forçar o pedido de demissão. Pouca demanda (subcarga) também está na lista de fatores de risco do MTE. Um retorno de verdade é planejado com a pessoa, a chefia e o médico do trabalho.", "f": ["guia", "cnj351"]}, {"tipo": "info", "tag": "Para fechar", "p": "O que as oito cenas têm em comum?", "txt": ["Em todas, o que adoece está na organização do trabalho: no ritmo, na meta, no tamanho da equipe, no jeito de mandar.", "“A fonte dos riscos psicossociais relacionados ao trabalho não está no indivíduo, mas sim na organização do trabalho.” (MTE, Manual de GRO e PGR da NR-1)"], "f": ["manual"]}], "nivel": "geral", "nivelNome": "Para o público geral"}, {"id": "fonte", "nome": "Fonte ou efeito?", "curto": "Fonte ou efeito", "dur": "5 min", "cor": "#1F7F73", "corEsc": "#5FD3C2", "desc": "Meta que sobe, insônia, burnout, “falta de resiliência”: é a fonte do risco, o efeito na saúde ou culpar a pessoa?", "telas": [{"tipo": "info", "tag": "Como funciona", "p": "Fonte, efeito ou culpar a pessoa?", "txt": ["Fonte: está na organização do trabalho e é o que a NR-1 manda mudar.", "Efeito: aparece na saúde de quem trabalha.", "Culpar a pessoa: põe a causa em quem adoece."], "f": ["guia"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Metas que sobem todo mês, sem consulta à equipe", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 0, "exp": "É fonte: excesso de demandas e baixo controle, dois fatores da lista do MTE. No inventário de riscos, entra como perigo, com a fonte e as circunstâncias.", "f": ["guia", "nr1"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Insônia", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 1, "exp": "É efeito. O inventário registra as possíveis lesões ou agravos à saúde, mas o que a norma manda mudar é a fonte.", "f": ["nr1"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Assédio de qualquer natureza", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 0, "exp": "É fonte: é o primeiro item da lista de fatores de risco psicossociais do MTE.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Burnout (esgotamento profissional)", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 1, "exp": "É efeito: um agravo à saúde ligado ao trabalho, que está na Lista de Doenças Relacionadas ao Trabalho do Ministério da Saúde. O MTE cita o esgotamento entre os efeitos possíveis dos fatores de risco.", "f": ["guia", "ldrt"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Equipe reduzida: quem sai não é reposto", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 0, "exp": "É fonte: sobrecarga. No exemplo do próprio MTE, aumentar a equipe pode até eliminar o perigo.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "“Fulano é fraco, não aguenta pressão”", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 2, "exp": "É culpar a pessoa. O Manual do MTE é direto: a fonte dos riscos psicossociais não está no indivíduo, mas na organização do trabalho.", "f": ["manual"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Dor no ombro e no punho (DORT)", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 1, "exp": "É efeito. E não só do esforço físico: o MTE liga sobrecarga, falta de autonomia e má gestão de mudanças também a DORT. Corpo e mente adoecem juntos.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Não poder decidir a hora da própria pausa", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 0, "exp": "É fonte: baixo controle no trabalho, ou falta de autonomia, está na lista do MTE.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "“Falta resiliência à equipe”", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 2, "exp": "É culpar a pessoa de novo. Treinar resiliência sem mexer na meta e na equipe deixa a fonte onde está; o MTE pede preferência às medidas que mudam a organização do trabalho.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Afastamento pelo INSS por depressão", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 1, "exp": "É efeito, e dos mais pesados: em 2025, o INSS concedeu 546 mil benefícios por transtornos mentais, 15,7% a mais que em 2024.", "f": ["inss"]}], "nivel": "geral", "nivelNome": "Para o público geral"}, {"id": "mito", "nome": "Mito ou verdade? NR-1 e saúde mental", "curto": "Mito ou verdade", "dur": "6 min", "cor": "#B3261E", "corEsc": "#FF8F84", "desc": "Questionário obrigatório? Avaliar a cabeça de cada um? O STF derrubou a regra? Dez frases sobre a NR-1, com a fonte de cada resposta.", "telas": [{"tipo": "escolha", "tag": "Mito ou verdade?", "p": "A NR-1 manda a empresa avaliar a saúde mental de cada trabalhador.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. O que se avalia são as condições de trabalho, e não a cabeça de cada um. “O objetivo do processo não é avaliar a saúde mental de cada trabalhador”, diz o guia do MTE.", "f": ["guia", "pr"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Riscos psicossociais entram no inventário de riscos da empresa, como o ruído ou um produto químico.", "ops": ["Verdade", "Mito"], "certa": 0, "exp": "Verdade. Desde a Portaria MTE 1.419/2024, o gerenciamento de riscos da NR-1 inclui expressamente os fatores de risco psicossociais relacionados ao trabalho (item 1.5.3.1.4). A regra vale desde 26/5/2026.", "f": ["nr1", "guia"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "O governo exige um questionário específico para medir os riscos psicossociais.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. O MTE não indica nenhuma ferramenta: vale observar o trabalho, conversar, fazer oficinas, aplicar questionário ou combinar tudo isso. E questionário sozinho não basta para gerenciar o risco.", "f": ["manual", "pr"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Se a empresa usar questionário, as respostas têm de ser anônimas.", "ops": ["Verdade", "Mito"], "certa": 0, "exp": "Verdade, segundo o MTE: “Sem confiança e anonimato, o diagnóstico será falho.” Quem tem medo de represália não conta o que adoece.", "f": ["manual"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Microempresa dispensada do PGR também fica dispensada de olhar os riscos psicossociais.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. A Avaliação Ergonômica Preliminar da NR-17 é obrigatória para todas as organizações, inclusive as dispensadas do PGR, e inclui os fatores de risco psicossociais.", "f": ["manual", "nr17"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Problemas da vida pessoal do trabalhador entram na avaliação de riscos da NR-1.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. Entram só os fatores relacionados ao trabalho, que vêm das condições em que o trabalho é feito.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Palestra de resiliência e aplicativo de meditação cumprem a obrigação da empresa.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. A NR-1 manda seguir uma ordem: primeiro eliminar ou reduzir o risco na fonte. O MTE pede preferência às medidas que mudam a organização do trabalho, e não às pessoais ou de comportamento.", "f": ["nr1", "guia"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Os trabalhadores têm de ser ouvidos na avaliação dos riscos.", "ops": ["Verdade", "Mito"], "certa": 0, "exp": "Verdade. A NR-17 garante que sejam ouvidos na avaliação ergonômica, e a NR-1 exige mecanismos de consulta. O Manual do MTE resume: não há avaliação válida dos riscos psicossociais “sem a voz do trabalhador”.", "f": ["nr17", "manual"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Só psicólogo pode fazer a avaliação de riscos psicossociais.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. A NR-1 e a NR-17 não exigem uma profissão. A empresa responde pelo processo e escolhe pessoa ou equipe com conhecimento técnico, de preferência de várias áreas. Psicólogas e psicólogos que fazem essa avaliação seguem a Resolução CFP 14/2023.", "f": ["pr", "cfp"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "O STF derrubou a parte da NR-1 sobre riscos psicossociais.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. O STF suspendeu só multas e autuações ligadas a cinco itens enquanto busca um acordo (ADPF 1.316 e outras duas). A norma continua valendo, e a obrigação de prevenir também. Até 2/12/2026, a AGU recebe sugestões sobre a proposta do MTE.", "f": ["stf", "agu"]}], "nivel": "geral", "nivelNome": "Para o público geral"}, {"id": "medida", "nome": "A medida certa", "curto": "A medida certa", "dur": "7 min", "cor": "#7A4A12", "corEsc": "#F0B05A", "desc": "Meditação, palestra ou mudar o trabalho? Quatro situações, a ordem de prioridade da NR-1 e uma nuvem de palavras com as ideias da plateia.", "telas": [{"tipo": "escolha", "tag": "Sobrecarga", "sit": "Escritório com equipe pequena: hora extra toda semana e almoço na frente do computador.", "p": "Qual medida ataca a fonte?", "ops": ["Contratar mais gente e redistribuir o trabalho", "Aplicativo de meditação para todos", "Palestra sobre gestão do tempo", "Prêmio para quem fizer mais hora extra"], "certa": 0, "exp": "É o exemplo do próprio guia do MTE: aumentar a equipe pode eliminar o perigo. Priorizar tarefas, ter metas possíveis e pausas de verdade completam. Meditação pode ajudar a pessoa, mas deixa a sobrecarga onde está.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Assédio", "sit": "Loja com ranking exposto e cobrança humilhante de quem não bate a meta.", "p": "Qual medida ataca a fonte?", "ops": ["Acabar com a exposição, rever as metas com a equipe e ter canal de denúncia que proteja quem denuncia", "Curso de inteligência emocional para os vendedores", "Trocar de loja quem reclamar", "Pedir à vítima que não leve para o lado pessoal"], "certa": 0, "exp": "Assédio se enfrenta na gestão: regras claras, canal de denúncia com sigilo, apuração e responsabilização de quem assedia, como prevê a Lei 14.457/2022 para as empresas com CIPA. Curso de emoções para a vítima não tira o assédio da sala.", "f": ["l14457", "guia"]}, {"tipo": "escolha", "tag": "Teleatendimento", "sit": "Central de atendimento com pausas cortadas e tempo de ligação cronometrado.", "p": "Qual medida ataca a fonte?", "ops": ["Garantir as pausas e rever o tempo de atendimento com quem atende", "Distribuir bolinha antiestresse", "Ginástica laboral de 5 minutos", "Trocar a música de espera"], "certa": 0, "exp": "A fonte é o ritmo imposto. O Anexo II da NR-17 garante as pausas e a ida ao banheiro a qualquer hora; rever metas e tempo médio com quem atende muda a organização do trabalho. Bolinha e alongamento não mexem no ritmo.", "f": ["nr17"]}, {"tipo": "escolha", "tag": "Violência de clientes", "sit": "Supermercado onde clientes agridem as operadoras de caixa.", "p": "Qual medida ataca a fonte?", "ops": ["Apoio imediato do fiscal, protocolo de segurança, registro e caixas suficientes", "Treinar a operadora para ter paciência", "Cartaz pedindo educação aos clientes", "Nada: faz parte do atendimento"], "certa": 0, "exp": "Prevenir a violência de terceiros é organização: gente suficiente para a fila não explodir, apoio na hora, registro de cada caso e retaguarda para quem foi agredida. Pedir paciência transfere o risco para a vítima.", "f": ["guia", "c190"]}, {"tipo": "ordenar", "tag": "A ordem da NR-1", "p": "Ponha na ordem da NR-1, da primeira medida para a última", "ops": ["Eliminar o perigo, mudando a organização do trabalho", "Medidas de proteção coletiva", "Medidas administrativas, como procedimentos e treinamentos", "Equipamento de proteção individual"], "certa": [0, 1, 2, 3], "exp": "A NR-1 manda evitar e eliminar o perigo antes de tudo, depois proteger o coletivo, só então usar medidas administrativas e, por último, a proteção individual (itens 1.4.1, alínea g, e 1.5.5.1.2). Não há equipamento individual contra o assédio ou a sobrecarga: o que funciona está nos primeiros degraus.", "f": ["nr1", "manual"]}, {"tipo": "nuvem", "tag": "A vez da plateia", "p": "Em uma palavra: que mudança faria diferença no seu trabalho?", "ex": "ex.: pausa", "exp": "Repare quantas respostas falam de organização do trabalho: pausa, equipe, meta, respeito, horário. É por aí que a NR-1 manda começar.", "f": ["guia"]}], "nivel": "geral", "nivelNome": "Para o público geral"}, {"id": "termometro", "nome": "Termômetro do coletivo", "curto": "Termômetro", "dur": "10 min", "cor": "#34306B", "corEsc": "#B7B1F2", "ao_vivo": true, "desc": "Uma roda de conversa no telão: nuvens de palavras e perguntas anônimas sobre pausas, metas, autonomia e apoio. Não é diagnóstico: é o ponto de partida.", "telas": [{"tipo": "info", "cena": "roda", "tag": "Antes de começar", "p": "Um retrato rápido, sem nome de ninguém", "txt": ["As respostas são anônimas: ninguém vê quem respondeu o quê, e o telão só mostra o resultado de cada pergunta a partir de 5 respostas.", "Não é diagnóstico de saúde nem a avaliação de riscos da NR-1. É um retrato rápido do grupo para começar a conversa."], "f": ["manual"]}, {"tipo": "nuvem", "tag": "Nuvem de palavras", "p": "Em uma palavra: o que mais pesa no seu trabalho hoje?", "ex": "ex.: metas", "exp": "Palavras que se repetem mostram o que é do coletivo, e não de uma pessoa só. É isso que a avaliação de riscos procura.", "f": ["guia"]}, {"tipo": "escala", "tag": "Pausas", "p": "Você consegue fazer as pausas de que precisa?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Pausa cortada é sinal de ritmo apertado e de pouco controle sobre o próprio trabalho, dois fatores da lista do MTE.", "f": ["guia"]}, {"tipo": "escala", "tag": "Metas e prazos", "p": "As metas e os prazos cabem na sua jornada?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Quando a meta não cabe na jornada, ela sai do descanso. Excesso de demandas é fator de risco.", "f": ["guia"]}, {"tipo": "escala", "tag": "Autonomia", "p": "Você tem voz sobre como fazer o seu trabalho?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Baixo controle e falta de autonomia estão entre os fatores de risco ligados a transtorno mental e a DORT.", "f": ["guia"]}, {"tipo": "escala", "tag": "Fora do horário", "p": "Você recebe mensagem de trabalho fora do horário?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [2, 3], "exp": "Cobrança fora do horário invade o descanso e a vida. Trabalho remoto e isolado é fator de risco na lista do MTE.", "f": ["guia"]}, {"tipo": "escala", "tag": "Respeito", "p": "Você já viu colega ser humilhado, xingado ou exposto no trabalho?", "ops": ["Nunca", "Uma vez", "Algumas vezes", "Muitas vezes"], "alerta": [1, 2, 3], "exp": "Assédio de qualquer natureza é o primeiro fator de risco da lista do MTE. Quem testemunha também adoece, e também pode denunciar.", "f": ["guia", "cnj351"]}, {"tipo": "escala", "tag": "Apoio", "p": "Quando aperta, você tem com quem contar no trabalho?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Falta de suporte e de apoio no trabalho é fator de risco. Apoio de colegas e da chefia protege.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Quem muda", "p": "Quem precisa estar na roda para mudar o que adoece?", "ops": ["Só a chefia", "Só o RH", "Trabalhadores, CIPA e sindicato, junto com a direção", "Uma consultoria de fora"], "certa": 2, "exp": "A NR-1 exige que a empresa consulte os trabalhadores (item 1.5.3.3), a NR-17 garante que sejam ouvidos, e a CIPA tem papel na prevenção do assédio. Quem faz o trabalho conhece o trabalho real.", "f": ["manual", "nr17", "l14457"]}, {"tipo": "nuvem", "tag": "Nuvem de palavras", "p": "Em uma palavra: o que você mudaria primeiro?", "ex": "ex.: equipe", "exp": "Este é o começo de um plano: o que mudar, com quem e até quando. A NR-1 pede plano de ação com cronograma, responsáveis e acompanhamento.", "f": ["nr1"]}, {"tipo": "info", "tag": "E agora?", "p": "Do retrato à mudança", "txt": ["Leve o resultado para a reunião de equipe, a CIPA ou o sindicato. O que se repete é do coletivo.", "Se alguém está sofrendo agora: UBS, CAPS, Cerest e o CVV, no 188, de graça e a qualquer hora.", "Assédio, pressão ou direito desrespeitado: veja os canais de denúncia no Vigie."], "f": []}], "nivel": "geral", "nivelNome": "Para o público geral"}, {"id": "caso", "nome": "Caso para decidir: a agência que bate meta", "curto": "Caso para decidir", "dur": "9 min", "cor": "#9A5F0C", "corEsc": "#F0B05A", "desc": "Uma história em seis decisões: a plateia escolhe cada passo de uma agência bancária que adoece a equipe, da escuta ao plano de ação.", "telas": [{"tipo": "info", "cena": "agencia", "tag": "O caso", "p": "A agência que bate meta", "txt": ["Numa agência bancária, as metas sobem todo mês, o ranking do dia sai no grupo da equipe às 20h e o último colocado “paga o café”.", "Em um ano, três pessoas se afastaram por transtorno mental. A nova gerente quer agir. Vocês decidem cada passo."], "f": []}, {"tipo": "escolha", "tag": "Passo 1", "p": "Qual é o primeiro passo?", "ops": ["Contratar uma palestra motivacional", "Ouvir a equipe sobre o trabalho real, com a CIPA e com anonimato garantido", "Substituir quem está afastado", "Esperar a fiscalização"], "certa": 1, "exp": "Tudo começa por conhecer o trabalho real, com quem o faz. A NR-1 exige consulta aos trabalhadores, e o MTE lembra que sem confiança e anonimato o diagnóstico é falho.", "f": ["manual"]}, {"tipo": "escolha", "tag": "Passo 2", "sit": "A escuta mostrou metas que sobem sem aviso, ranking exposto no grupo e cobrança depois das 20h.", "p": "O que vai para o inventário de riscos?", "ops": ["Só o número de afastados", "As metas, o ranking exposto e a cobrança fora do horário, com os agravos possíveis", "O nome de quem está doente", "Nada: isso é gestão normal"], "certa": 1, "exp": "O inventário descreve os perigos, com suas fontes e circunstâncias, e os possíveis agravos à saúde (NR-1, item 1.5.7.3.2). Nome e diagnóstico de ninguém entram ali.", "f": ["nr1", "guia"]}, {"tipo": "escolha", "tag": "Passo 3", "p": "Qual medida entra primeiro no plano de ação?", "ops": ["Rever as metas com a equipe, acabar com o ranking exposto e combinar horário para mensagens", "Meditação guiada às 7h da manhã", "Bônus para quem não faltar", "Avaliação psicológica individual de todo mundo"], "certa": 0, "exp": "A medida vai na fonte: meta, exposição e jornada. O plano de ação da NR-1 precisa de cronograma, responsáveis e forma de acompanhar (item 1.5.5.2.2). Bônus por não faltar empurra gente doente para o trabalho, e avaliação individual não é o que a norma pede.", "f": ["nr1", "guia"]}, {"tipo": "escolha", "tag": "Passo 4", "sit": "Uma bancária volta de licença por depressão.", "p": "O que a agência deve fazer?", "ops": ["Deixá-la sem tarefas, num canto, até “se recuperar”", "Planejar o retorno com ela, a chefia e o médico do trabalho, sem retaliação", "Demitir para evitar outra licença", "Manter as mesmas metas para não dar privilégio"], "certa": 1, "exp": "Retorno é cuidado planejado, com a pessoa, ajustando tarefas e metas. Isolar e esvaziar o trabalho é assédio. Demitir ou manter as mesmas metas ignora justamente o que adoeceu.", "f": ["guia", "cnj351"]}, {"tipo": "escolha", "tag": "Passo 5", "sit": "Três meses depois.", "p": "Como saber se funcionou?", "ops": ["Ver se o lucro subiu", "Acompanhar com a equipe e a CIPA: afastamentos, horas extras e queixas, e refazer a avaliação", "Pesquisa de clima uma vez por ano, e só", "Se ninguém reclamar, deu certo"], "certa": 1, "exp": "A NR-1 manda revisar a avaliação depois das medidas (item 1.5.4.4.6), e o MTE pede que o acompanhamento seja feito com a participação de quem trabalha. Silêncio não é sinal de saúde: pode ser medo.", "f": ["nr1", "guia"]}, {"tipo": "escolha", "tag": "Opinião", "p": "Na sua opinião, os riscos psicossociais deveriam ter regra mais detalhada?", "ops": ["Sim, com uma norma só para eles", "Sim, detalhando a NR-1 e a NR-17", "Não, a regra atual basta", "Não sei"], "certa": null, "exp": "Não há resposta certa: é o debate em curso. O Observatório Nacional de Saúde Mental do Trabalhador e da Trabalhadora defende uma norma própria e critica pôr esses riscos numa matriz de probabilidade e gravidade. Entidades patronais pedem critérios mais objetivos e foram ao STF. O MTE propôs definir os fatores de risco psicossociais na NR-1, ligados à NR-17, sem questionário obrigatório. Até 2/12/2026, qualquer pessoa ou entidade pode mandar sugestões à AGU.", "f": ["obs", "stf", "antep", "agu"]}], "nivel": "geral", "nivelNome": "Para o público geral"}], "cenas": {"agencia": "<svg viewBox=\"0 0 640 360\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\" preserveAspectRatio=\"xMidYMid meet\"><rect width=\"640\" height=\"360\" fill=\"#E8EEF6\"/><rect y=\"300\" width=\"640\" height=\"60\" fill=\"#D3DCE8\"/><g><path d=\"M143,146 Q140,190 148,202 L192,202 Q200,190 197,146 Z\" fill=\"#2A1A10\"/><rect x=\"161\" y=\"168\" w
