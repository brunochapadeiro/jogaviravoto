<script>window.SM_DADOS = {"jogos": [{"id": "cenas", "nome": "Isso adoece? Cenas de trabalho", "curto": "Cenas de trabalho", "dur": "8 min", "cor": "#1F4E8C", "corEsc": "#A6C8FF", "desc": "Oito cenas ilustradas de trabalho real: telemarketing, hospital, aplicativo, home office, supermercado. Qual é o fator de risco em cada uma?", "telas": [{"tipo": "escolha", "cena": "tele", "tag": "Teleatendimento", "sit": "Central de atendimento: 38 clientes na fila, 5 minutos por ligação no relógio e 5 minutos de banheiro no dia todo.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Falta de controle sobre o próprio ritmo e as pausas", "Ela não sabe lidar com pressão", "Pouco trabalho para fazer", "Nenhum: todo call center é assim"], "certa": 0, "exp": "O sistema decide o ritmo, o tempo de cada ligação e até a ida ao banheiro. Baixo controle e falta de autonomia estão na lista de fatores de risco do MTE, ligados a transtorno mental e a DORT. A NR-17 tem um anexo só para o teleatendimento, que garante pausas e a saída do posto para ir ao banheiro a qualquer hora, sem prejuízo na avaliação.", "f": ["guia", "nr17"]}, {"tipo": "escolha", "cena": "enfermagem", "tag": "Hospital", "sit": "Hospital, 3h40: uma técnica de enfermagem para 14 leitos, no segundo plantão seguido, com três pacientes chamando ao mesmo tempo.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Excesso de demandas e jornada longa", "Falta de vocação para a enfermagem", "Pouca clareza sobre a função", "Nenhum: plantão é assim mesmo"], "certa": 0, "exp": "Gente de menos para trabalho demais, emendando plantões: é a sobrecarga, que o MTE liga a transtorno mental e a DORT. Não é falta de vocação. A medida que ataca a fonte é dimensionar a equipe e limitar a jornada, e não pedir mais esforço a quem já está no limite.", "f": ["guia"]}, {"tipo": "escolha", "cena": "vendas", "tag": "Vendas", "sit": "Reunião de vendas: o ranking do mês fica na parede, e o gerente manda o último colocado vestir a fantasia de tartaruga na frente de todos.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Assédio moral: humilhar quem não bate a meta", "Uma brincadeira para motivar a equipe", "Falta de talento para vendas", "Pouca clareza sobre a função"], "certa": 0, "exp": "Expor e ridicularizar quem não bate a meta é assédio moral: conduta que fere a dignidade e degrada o ambiente de trabalho. Quando vira método de gestão, é assédio organizacional. Assédio de qualquer natureza é o primeiro item da lista de fatores de risco psicossociais do MTE.", "f": ["guia", "cnj351"]}, {"tipo": "escolha", "cena": "entregador", "tag": "Aplicativo", "sit": "Entregador de aplicativo, 22h47, na chuva: o celular dá 15 segundos para aceitar a corrida e avisa que a taxa de aceitação caiu e que ele pode ser bloqueado.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Controle por algoritmo e ameaça de bloqueio sem explicação", "Ele é lento e desorganizado", "Trabalho com pouca demanda", "Nenhum: é autônomo e faz o próprio horário"], "certa": 0, "exp": "Quem decide o ritmo é o aplicativo, com prazo de segundos e punição sem explicação. São dois fatores da lista do MTE: baixo controle no trabalho e baixa justiça organizacional. Chamar de “autônomo” não tira o risco, que está no jeito como o trabalho é organizado.", "f": ["guia"]}, {"tipo": "escolha", "cena": "remoto", "tag": "Teletrabalho", "sit": "Teletrabalho, 23h17: 14 mensagens no grupo da equipe pedindo uma tarefa para a manhã seguinte.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Jornada sem fim: cobrança fora do horário", "Ela não sabe se organizar", "Trabalho remoto é sempre mais leve", "Nenhum: é só responder amanhã"], "certa": 0, "exp": "Mensagem de trabalho às 23h vira hora extra invisível e tira o descanso. Trabalho remoto e isolado está na lista de fatores de risco do MTE, ligado a transtorno mental e a fadiga. A saída é coletiva: combinar horários de contato e prazos possíveis, em vez de esperar que cada um se desconecte sozinho.", "f": ["guia"]}, {"tipo": "escolha", "cena": "caixa", "tag": "Supermercado", "sit": "Supermercado: fila de 12 pessoas, um cliente grita com a operadora de caixa, e o fiscal chamado há 10 minutos não aparece.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Violência de cliente, sem apoio da empresa", "Ela deveria ter mais paciência", "Autonomia demais", "Nenhum: o cliente tem sempre razão"], "certa": 0, "exp": "Agressão de cliente é violência no trabalho, e ficar sozinha diante dela é falta de apoio: os dois estão na lista do MTE (eventos violentos e falta de suporte). A Convenção 190 da OIT, que está no Congresso, inclui a violência de clientes e do público. Prevenir é ter gente suficiente, apoio na hora e registro de cada caso.", "f": ["guia", "c190"]}, {"tipo": "escolha", "cena": "mudanca", "tag": "Escritório", "sit": "Escritório: um comunicado avisa que o sistema muda na segunda, sem treinamento, e que as metas continuam as mesmas.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Mudança imposta, sem preparo e sem participação", "Resistência das pessoas à tecnologia", "Pouco trabalho para fazer", "Nenhum: mudar faz parte"], "certa": 0, "exp": "Mudar não adoece por si. Adoece mudar de cima para baixo, sem treinamento, sem ajustar a meta e sem ouvir quem faz o trabalho. “Má gestão de mudanças organizacionais” está na lista do MTE. Chamar isso de resistência joga o problema nas costas de quem trabalha.", "f": ["guia"]}, {"tipo": "escolha", "cena": "retorno", "tag": "Retorno ao trabalho", "sit": "Volta do afastamento: a trabalhadora ganha uma mesa no corredor, ao lado do depósito, sem computador, sem tarefas e longe da equipe.", "p": "Qual é o principal fator de risco nesta cena?", "ops": ["Isolamento e esvaziamento das tarefas: assédio", "Cuidado para ela se recuperar aos poucos", "Excesso de demandas", "Nenhum: não havia outra mesa"], "certa": 0, "exp": "Tirar as tarefas, isolar e esconder a pessoa é uma forma conhecida de assédio moral, muitas vezes para forçar o pedido de demissão. Pouca demanda (subcarga) também está na lista de fatores de risco do MTE. Um retorno de verdade é planejado com a pessoa, a chefia e o médico do trabalho.", "f": ["guia", "cnj351"]}, {"tipo": "info", "tag": "Para fechar", "p": "O que as oito cenas têm em comum?", "txt": ["Em todas, o que adoece está na organização do trabalho: no ritmo, na meta, no tamanho da equipe, no jeito de mandar.", "“A fonte dos riscos psicossociais relacionados ao trabalho não está no indivíduo, mas sim na organização do trabalho.” (MTE, Manual de GRO e PGR da NR-1)"], "f": ["manual"]}]}, {"id": "fonte", "nome": "Fonte ou efeito?", "curto": "Fonte ou efeito", "dur": "5 min", "cor": "#1F7F73", "corEsc": "#5FD3C2", "desc": "Meta que sobe, insônia, burnout, “falta de resiliência”: é a fonte do risco, o efeito na saúde ou culpar a pessoa?", "telas": [{"tipo": "info", "tag": "Como funciona", "p": "Fonte, efeito ou culpar a pessoa?", "txt": ["Fonte: está na organização do trabalho e é o que a NR-1 manda mudar.", "Efeito: aparece na saúde de quem trabalha.", "Culpar a pessoa: põe a causa em quem adoece."], "f": ["guia"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Metas que sobem todo mês, sem consulta à equipe", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 0, "exp": "É fonte: excesso de demandas e baixo controle, dois fatores da lista do MTE. No inventário de riscos, entra como perigo, com a fonte e as circunstâncias.", "f": ["guia", "nr1"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Insônia", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 1, "exp": "É efeito. O inventário registra as possíveis lesões ou agravos à saúde, mas o que a norma manda mudar é a fonte.", "f": ["nr1"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Assédio de qualquer natureza", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 0, "exp": "É fonte: é o primeiro item da lista de fatores de risco psicossociais do MTE.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Burnout (esgotamento profissional)", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 1, "exp": "É efeito: um agravo à saúde ligado ao trabalho, que está na Lista de Doenças Relacionadas ao Trabalho do Ministério da Saúde. O MTE cita o esgotamento entre os efeitos possíveis dos fatores de risco.", "f": ["guia", "ldrt"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Equipe reduzida: quem sai não é reposto", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 0, "exp": "É fonte: sobrecarga. No exemplo do próprio MTE, aumentar a equipe pode até eliminar o perigo.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "“Fulano é fraco, não aguenta pressão”", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 2, "exp": "É culpar a pessoa. O Manual do MTE é direto: a fonte dos riscos psicossociais não está no indivíduo, mas na organização do trabalho.", "f": ["manual"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Dor no ombro e no punho (DORT)", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 1, "exp": "É efeito. E não só do esforço físico: o MTE liga sobrecarga, falta de autonomia e má gestão de mudanças também a DORT. Corpo e mente adoecem juntos.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Não poder decidir a hora da própria pausa", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 0, "exp": "É fonte: baixo controle no trabalho, ou falta de autonomia, está na lista do MTE.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "“Falta resiliência à equipe”", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 2, "exp": "É culpar a pessoa de novo. Treinar resiliência sem mexer na meta e na equipe deixa a fonte onde está; o MTE pede preferência às medidas que mudam a organização do trabalho.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Fonte ou efeito?", "p": "Afastamento pelo INSS por depressão", "ops": ["Fonte: está na organização do trabalho", "Efeito: aparece na saúde", "Nenhum dos dois: é culpar a pessoa"], "certa": 1, "exp": "É efeito, e dos mais pesados: em 2025, o INSS concedeu 546 mil benefícios por transtornos mentais, 15,7% a mais que em 2024.", "f": ["inss"]}]}, {"id": "mito", "nome": "Mito ou verdade? NR-1 e saúde mental", "curto": "Mito ou verdade", "dur": "6 min", "cor": "#B3261E", "corEsc": "#FF8F84", "desc": "Questionário obrigatório? Avaliar a cabeça de cada um? O STF derrubou a regra? Dez frases sobre a NR-1, com a fonte de cada resposta.", "telas": [{"tipo": "escolha", "tag": "Mito ou verdade?", "p": "A NR-1 manda a empresa avaliar a saúde mental de cada trabalhador.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. O que se avalia são as condições de trabalho, e não a cabeça de cada um. “O objetivo do processo não é avaliar a saúde mental de cada trabalhador”, diz o guia do MTE.", "f": ["guia", "pr"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Riscos psicossociais entram no inventário de riscos da empresa, como o ruído ou um produto químico.", "ops": ["Verdade", "Mito"], "certa": 0, "exp": "Verdade. Desde a Portaria MTE 1.419/2024, o gerenciamento de riscos da NR-1 inclui expressamente os fatores de risco psicossociais relacionados ao trabalho (item 1.5.3.1.4). A regra vale desde 26/5/2026.", "f": ["nr1", "guia"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "O governo exige um questionário específico para medir os riscos psicossociais.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. O MTE não indica nenhuma ferramenta: vale observar o trabalho, conversar, fazer oficinas, aplicar questionário ou combinar tudo isso. E questionário sozinho não basta para gerenciar o risco.", "f": ["manual", "pr"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Se a empresa usar questionário, as respostas têm de ser anônimas.", "ops": ["Verdade", "Mito"], "certa": 0, "exp": "Verdade, segundo o MTE: “Sem confiança e anonimato, o diagnóstico será falho.” Quem tem medo de represália não conta o que adoece.", "f": ["manual"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Microempresa dispensada do PGR também fica dispensada de olhar os riscos psicossociais.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. A Avaliação Ergonômica Preliminar da NR-17 é obrigatória para todas as organizações, inclusive as dispensadas do PGR, e inclui os fatores de risco psicossociais.", "f": ["manual", "nr17"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Problemas da vida pessoal do trabalhador entram na avaliação de riscos da NR-1.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. Entram só os fatores relacionados ao trabalho, que vêm das condições em que o trabalho é feito.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Palestra de resiliência e aplicativo de meditação cumprem a obrigação da empresa.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. A NR-1 manda seguir uma ordem: primeiro eliminar ou reduzir o risco na fonte. O MTE pede preferência às medidas que mudam a organização do trabalho, e não às pessoais ou de comportamento.", "f": ["nr1", "guia"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Os trabalhadores têm de ser ouvidos na avaliação dos riscos.", "ops": ["Verdade", "Mito"], "certa": 0, "exp": "Verdade. A NR-17 garante que sejam ouvidos na avaliação ergonômica, e a NR-1 exige mecanismos de consulta. O Manual do MTE resume: não há avaliação válida dos riscos psicossociais “sem a voz do trabalhador”.", "f": ["nr17", "manual"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "Só psicólogo pode fazer a avaliação de riscos psicossociais.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. A NR-1 e a NR-17 não exigem uma profissão. A empresa responde pelo processo e escolhe pessoa ou equipe com conhecimento técnico, de preferência de várias áreas. Psicólogas e psicólogos que fazem essa avaliação seguem a Resolução CFP 14/2023.", "f": ["pr", "cfp"]}, {"tipo": "escolha", "tag": "Mito ou verdade?", "p": "O STF derrubou a parte da NR-1 sobre riscos psicossociais.", "ops": ["Verdade", "Mito"], "certa": 1, "exp": "Mito. O STF suspendeu só multas e autuações ligadas a cinco itens enquanto busca um acordo (ADPF 1.316 e outras duas). A norma continua valendo, e a obrigação de prevenir também. Até 2/12/2026, a AGU recebe sugestões sobre a proposta do MTE.", "f": ["stf", "agu"]}]}, {"id": "medida", "nome": "A medida certa", "curto": "A medida certa", "dur": "7 min", "cor": "#7A4A12", "corEsc": "#F0B05A", "desc": "Meditação, palestra ou mudar o trabalho? Quatro situações, a ordem de prioridade da NR-1 e uma nuvem de palavras com as ideias da plateia.", "telas": [{"tipo": "escolha", "tag": "Sobrecarga", "sit": "Escritório com equipe pequena: hora extra toda semana e almoço na frente do computador.", "p": "Qual medida ataca a fonte?", "ops": ["Contratar mais gente e redistribuir o trabalho", "Aplicativo de meditação para todos", "Palestra sobre gestão do tempo", "Prêmio para quem fizer mais hora extra"], "certa": 0, "exp": "É o exemplo do próprio guia do MTE: aumentar a equipe pode eliminar o perigo. Priorizar tarefas, ter metas possíveis e pausas de verdade completam. Meditação pode ajudar a pessoa, mas deixa a sobrecarga onde está.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Assédio", "sit": "Loja com ranking exposto e cobrança humilhante de quem não bate a meta.", "p": "Qual medida ataca a fonte?", "ops": ["Acabar com a exposição, rever as metas com a equipe e ter canal de denúncia que proteja quem denuncia", "Curso de inteligência emocional para os vendedores", "Trocar de loja quem reclamar", "Pedir à vítima que não leve para o lado pessoal"], "certa": 0, "exp": "Assédio se enfrenta na gestão: regras claras, canal de denúncia com sigilo, apuração e responsabilização de quem assedia, como prevê a Lei 14.457/2022 para as empresas com CIPA. Curso de emoções para a vítima não tira o assédio da sala.", "f": ["l14457", "guia"]}, {"tipo": "escolha", "tag": "Teleatendimento", "sit": "Central de atendimento com pausas cortadas e tempo de ligação cronometrado.", "p": "Qual medida ataca a fonte?", "ops": ["Garantir as pausas e rever o tempo de atendimento com quem atende", "Distribuir bolinha antiestresse", "Ginástica laboral de 5 minutos", "Trocar a música de espera"], "certa": 0, "exp": "A fonte é o ritmo imposto. O Anexo II da NR-17 garante as pausas e a ida ao banheiro a qualquer hora; rever metas e tempo médio com quem atende muda a organização do trabalho. Bolinha e alongamento não mexem no ritmo.", "f": ["nr17"]}, {"tipo": "escolha", "tag": "Violência de clientes", "sit": "Supermercado onde clientes agridem as operadoras de caixa.", "p": "Qual medida ataca a fonte?", "ops": ["Apoio imediato do fiscal, protocolo de segurança, registro e caixas suficientes", "Treinar a operadora para ter paciência", "Cartaz pedindo educação aos clientes", "Nada: faz parte do atendimento"], "certa": 0, "exp": "Prevenir a violência de terceiros é organização: gente suficiente para a fila não explodir, apoio na hora, registro de cada caso e retaguarda para quem foi agredida. Pedir paciência transfere o risco para a vítima.", "f": ["guia", "c190"]}, {"tipo": "ordenar", "tag": "A ordem da NR-1", "p": "Ponha na ordem da NR-1, da primeira medida para a última", "ops": ["Eliminar o perigo, mudando a organização do trabalho", "Medidas de proteção coletiva", "Medidas administrativas, como procedimentos e treinamentos", "Equipamento de proteção individual"], "certa": [0, 1, 2, 3], "exp": "A NR-1 manda evitar e eliminar o perigo antes de tudo, depois proteger o coletivo, só então usar medidas administrativas e, por último, a proteção individual (itens 1.4.1, alínea g, e 1.5.5.1.2). Não há equipamento individual contra o assédio ou a sobrecarga: o que funciona está nos primeiros degraus.", "f": ["nr1", "manual"]}, {"tipo": "nuvem", "tag": "A vez da plateia", "p": "Em uma palavra: que mudança faria diferença no seu trabalho?", "ex": "ex.: pausa", "exp": "Repare quantas respostas falam de organização do trabalho: pausa, equipe, meta, respeito, horário. É por aí que a NR-1 manda começar.", "f": ["guia"]}]}, {"id": "termometro", "nome": "Termômetro do coletivo", "curto": "Termômetro", "dur": "10 min", "cor": "#34306B", "corEsc": "#B7B1F2", "ao_vivo": true, "desc": "Uma roda de conversa no telão: nuvens de palavras e perguntas anônimas sobre pausas, metas, autonomia e apoio. Não é diagnóstico: é o ponto de partida.", "telas": [{"tipo": "info", "cena": "roda", "tag": "Antes de começar", "p": "Um retrato rápido, sem nome de ninguém", "txt": ["As respostas são anônimas: ninguém vê quem respondeu o quê, e o telão só mostra o resultado de cada pergunta a partir de 5 respostas.", "Não é diagnóstico de saúde nem a avaliação de riscos da NR-1. É um retrato rápido do grupo para começar a conversa."], "f": ["manual"]}, {"tipo": "nuvem", "tag": "Nuvem de palavras", "p": "Em uma palavra: o que mais pesa no seu trabalho hoje?", "ex": "ex.: metas", "exp": "Palavras que se repetem mostram o que é do coletivo, e não de uma pessoa só. É isso que a avaliação de riscos procura.", "f": ["guia"]}, {"tipo": "escala", "tag": "Pausas", "p": "Você consegue fazer as pausas de que precisa?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Pausa cortada é sinal de ritmo apertado e de pouco controle sobre o próprio trabalho, dois fatores da lista do MTE.", "f": ["guia"]}, {"tipo": "escala", "tag": "Metas e prazos", "p": "As metas e os prazos cabem na sua jornada?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Quando a meta não cabe na jornada, ela sai do descanso. Excesso de demandas é fator de risco.", "f": ["guia"]}, {"tipo": "escala", "tag": "Autonomia", "p": "Você tem voz sobre como fazer o seu trabalho?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Baixo controle e falta de autonomia estão entre os fatores de risco ligados a transtorno mental e a DORT.", "f": ["guia"]}, {"tipo": "escala", "tag": "Fora do horário", "p": "Você recebe mensagem de trabalho fora do horário?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [2, 3], "exp": "Cobrança fora do horário invade o descanso e a vida. Trabalho remoto e isolado é fator de risco na lista do MTE.", "f": ["guia"]}, {"tipo": "escala", "tag": "Respeito", "p": "Você já viu colega ser humilhado, xingado ou exposto no trabalho?", "ops": ["Nunca", "Uma vez", "Algumas vezes", "Muitas vezes"], "alerta": [1, 2, 3], "exp": "Assédio de qualquer natureza é o primeiro fator de risco da lista do MTE. Quem testemunha também adoece, e também pode denunciar.", "f": ["guia", "cnj351"]}, {"tipo": "escala", "tag": "Apoio", "p": "Quando aperta, você tem com quem contar no trabalho?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Falta de suporte e de apoio no trabalho é fator de risco. Apoio de colegas e da chefia protege.", "f": ["guia"]}, {"tipo": "escolha", "tag": "Quem muda", "p": "Quem precisa estar na roda para mudar o que adoece?", "ops": ["Só a chefia", "Só o RH", "Trabalhadores, CIPA e sindicato, junto com a direção", "Uma consultoria de fora"], "certa": 2, "exp": "A NR-1 exige que a empresa consulte os trabalhadores (item 1.5.3.3), a NR-17 garante que sejam ouvidos, e a CIPA tem papel na prevenção do assédio. Quem faz o trabalho conhece o trabalho real.", "f": ["manual", "nr17", "l14457"]}, {"tipo": "nuvem", "tag": "Nuvem de palavras", "p": "Em uma palavra: o que você mudaria primeiro?", "ex": "ex.: equipe", "exp": "Este é o começo de um plano: o que mudar, com quem e até quando. A NR-1 pede plano de ação com cronograma, responsáveis e acompanhamento.", "f": ["nr1"]}, {"tipo": "info", "tag": "E agora?", "p": "Do retrato à mudança", "txt": ["Leve o resultado para a reunião de equipe, a CIPA ou o sindicato. O que se repete é do coletivo.", "Se alguém está sofrendo agora: UBS, CAPS, Cerest e o CVV, no 188, de graça e a qualquer hora.", "Assédio, pressão ou direito desrespeitado: veja os canais de denúncia no Vigie."], "f": []}]}, {"id": "caso", "nome": "Caso para decidir: a agência que bate meta", "curto": "Caso para decidir", "dur": "9 min", "cor": "#9A5F0C", "corEsc": "#F0B05A", "desc": "Uma história em seis decisões: a plateia escolhe cada passo de uma agência bancária que adoece a equipe, da escuta ao plano de ação.", "telas": [{"tipo": "info", "cena": "agencia", "tag": "O caso", "p": "A agência que bate meta", "txt": ["Numa agência bancária, as metas sobem todo mês, o ranking do dia sai no grupo da equipe às 20h e o último colocado “paga o café”.", "Em um ano, três pessoas se afastaram por transtorno mental. A nova gerente quer agir. Vocês decidem cada passo."], "f": []}, {"tipo": "escolha", "tag": "Passo 1", "p": "Qual é o primeiro passo?", "ops": ["Contratar uma palestra motivacional", "Ouvir a equipe sobre o trabalho real, com a CIPA e com anonimato garantido", "Substituir quem está afastado", "Esperar a fiscalização"], "certa": 1, "exp": "Tudo começa por conhecer o trabalho real, com quem o faz. A NR-1 exige consulta aos trabalhadores, e o MTE lembra que sem confiança e anonimato o diagnóstico é falho.", "f": ["manual"]}, {"tipo": "escolha", "tag": "Passo 2", "sit": "A escuta mostrou metas que sobem sem aviso, ranking exposto no grupo e cobrança depois das 20h.", "p": "O que vai para o inventário de riscos?", "ops": ["Só o número de afastados", "As metas, o ranking exposto e a cobrança fora do horário, com os agravos possíveis", "O nome de quem está doente", "Nada: isso é gestão normal"], "certa": 1, "exp": "O inventário descreve os perigos, com suas fontes e circunstâncias, e os possíveis agravos à saúde (NR-1, item 1.5.7.3.2). Nome e diagnóstico de ninguém entram ali.", "f": ["nr1", "guia"]}, {"tipo": "escolha", "tag": "Passo 3", "p": "Qual medida entra primeiro no plano de ação?", "ops": ["Rever as metas com a equipe, acabar com o ranking exposto e combinar horário para mensagens", "Meditação guiada às 7h da manhã", "Bônus para quem não faltar", "Avaliação psicológica individual de todo mundo"], "certa": 0, "exp": "A medida vai na fonte: meta, exposição e jornada. O plano de ação da NR-1 precisa de cronograma, responsáveis e forma de acompanhar (item 1.5.5.2.2). Bônus por não faltar empurra gente doente para o trabalho, e avaliação individual não é o que a norma pede.", "f": ["nr1", "guia"]}, {"tipo": "escolha", "tag": "Passo 4", "sit": "Uma bancária volta de licença por depressão.", "p": "O que a agência deve fazer?", "ops": ["Deixá-la sem tarefas, num canto, até “se recuperar”", "Planejar o retorno com ela, a chefia e o médico do trabalho, sem retaliação", "Demitir para evitar outra licença", "Manter as mesmas metas para não dar privilégio"], "certa": 1, "exp": "Retorno é cuidado planejado, com a pessoa, ajustando tarefas e metas. Isolar e esvaziar o trabalho é assédio. Demitir ou manter as mesmas metas ignora justamente o que adoeceu.", "f": ["guia", "cnj351"]}, {"tipo": "escolha", "tag": "Passo 5", "sit": "Três meses depois.", "p": "Como saber se funcionou?", "ops": ["Ver se o lucro subiu", "Acompanhar com a equipe e a CIPA: afastamentos, horas extras e queixas, e refazer a avaliação", "Pesquisa de clima uma vez por ano, e só", "Se ninguém reclamar, deu certo"], "certa": 1, "exp": "A NR-1 manda revisar a avaliação depois das medidas (item 1.5.4.4.6), e o MTE pede que o acompanhamento seja feito com a participação de quem trabalha. Silêncio não é sinal de saúde: pode ser medo.", "f": ["nr1", "guia"]}, {"tipo": "escolha", "tag": "Opinião", "p": "Na sua opinião, os riscos psicossociais deveriam ter regra mais detalhada?", "ops": ["Sim, com uma norma só para eles", "Sim, detalhando a NR-1 e a NR-17", "Não, a regra atual basta", "Não sei"], "certa": null, "exp": "Não há resposta certa: é o debate em curso. O Observatório Nacional de Saúde Mental do Trabalhador e da Trabalhadora defende uma norma própria e critica pôr esses riscos numa matriz de probabilidade e gravidade. Entidades patronais pedem critérios mais objetivos e foram ao STF. O MTE propôs definir os fatores de risco psicossociais na NR-1, ligados à NR-17, sem questionário obrigatório. Até 2/12/2026, qualquer pessoa ou entidade pode mandar sugestões à AGU.", "f": ["obs", "stf", "antep", "agu"]}]}], "cenas": {"agencia": "<svg viewBox=\"0 0 640 360\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\" preserveAspectRatio=\"xMidYMid meet\"><rect width=\"640\" height=\"360\" fill=\"#E8EEF6\"/><rect y=\"300\" width=\"640\" height=\"60\" fill=\"#D3DCE8\"/><g><path d=\"M143,146 Q140,190 148,202 L192,202 Q200,190 197,146 Z\" fill=\"#2A1A10\"/><rect x=\"161\" y=\"168\" width=\"18\" height=\"14\" fill=\"#E0AC69\"/><path d=\"M132,260 L134,200 Q136,178 158,178 L182,178 Q204,178 206,200 L208,260 Z\" fill=\"#1F4E8C\"/><path d=\"M198,200 Q210,220 184,222\" stroke=\"#1F4E8C\" stroke-width=\"15\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"168\" y=\"206\" width=\"18\" height=\"28\" rx=\"3\" fill=\"#17191E\"/><rect x=\"171\" y=\"210\" width=\"12\" height=\"18\" rx=\"1\" fill=\"#9FD3FF\"/><circle cx=\"170\" cy=\"150\" r=\"24\" fill=\"#E0AC69\"/><path d=\"M145,148 Q14 ", "https://atos.cnj.jus.br/atos/detalhar/3557"], "c190": ["Convenção 190 da OIT no Congresso (PDL 997/2026)", "https://www.congressonacional.leg.br/materias/materias-bicamerais/-/ver/pdl-997-2026"], "cfp": ["CFP lança a edição comentada da Resolução 14/2023, sobre avaliação de riscos psicossociais", "https://site.cfp.org.br/cfp-lanca-edicao-comentada-de-normativa-sobre-riscos-psicossociais-nas-relacoes-de-trabalho/"], "obs": ["Observatório Nacional de Saúde Mental do Trabalhador e da Trabalhadora: análise crítica da NR-1 (2026)", ""]}};</script>

<script>/* Vigie a Democracia · Saúde mental e riscos psicossociais: desenho das telas, das respostas e dos resultados.
   É o mesmo motor no jogo sozinho, no telão e no celular da plateia.
   © 2026 Prof. Bruno Chapadeiro · CC BY-NC-SA 4.0 · Feito com auxílio de IA. */
(function () {
  'use strict';
  var D = window.SM_DADOS || { jogos: [], cenas: {}, fontes: {} };
  var LETRAS = 'ABCDEFGH';

  function el(tag, at, filhos) {
    var e = document.createElement(tag);
    if (at) for (var k in at) {
      if (at[k] == null || at[k] === false) continue;
      if (k === 'cls') e.className = at[k];
      else if (k === 'txt') e.textContent = at[k];
      else if (k === 'html') e.innerHTML = at[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), at[k]);
      else e.setAttribute(k, at[k] === true ? '' : at[k]);
    }
    (filhos || []).forEach(function (f) { if (f != null) e.appendChild(typeof f === 'string' ? document.createTextNode(f) : f); });
    return e;
  }

  function jogo(id) { for (var k = 0; k < D.jogos.length; k++) if (D.jogos[k].id === id) return D.jogos[k]; return null; }
  function nOps(t) { return t.tipo === 'nuvem' || t.tipo === 'info' ? 0 : t.ops.length; }
  function pct(n, tot) { return tot ? Math.round((n / tot) * 100) : 0; }
  function temCerta(t) { return t.tipo === 'escolha' && t.certa != null; }

  // embaralha com semente (a mesma ordem para todo mundo na mesma tela)
  function embaralha(n, semente) {
    var a = []; for (var k = 0; k < n; k++) a.push(k);
    var s = semente || 1;
    for (var i = n - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; var j = Math.floor((s / 233280) * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }

  function fontes(ids) {
    ids = (ids || []).filter(function (f) { return D.fontes[f]; });
    if (!ids.length) return null;
    var p = el('p', { cls: 'sm-fontes' }, [ids.length > 1 ? 'Fontes: ' : 'Fonte: ']);
    ids.forEach(function (f, k) {
      var x = D.fontes[f];
      if (k) p.appendChild(document.createTextNode('; '));
      p.appendChild(x[1] ? el('a', { href: x[1], target: '_blank', rel: 'noopener', txt: x[0] }) : el('span', { txt: x[0] }));
    });
    return p;
  }

  function cena(id, cls) {
    if (!id || !D.cenas[id]) return null;
    return el('div', { cls: 'sm-cena ' + (cls || ''), html: D.cenas[id] });
  }

  // cabeçalho da pergunta: etiqueta, situação, cena e a pergunta
  function pergunta(t, o) {
    o = o || {};
    var h = el(o.h || 'h3', { cls: 'sm-p', tabindex: '-1', txt: t.p });
    var bloco = el('div', { cls: 'sm-perg' }, [
      t.tag ? el('p', { cls: 'sm-tag', txt: t.tag }) : null,
      o.semCena ? null : cena(t.cena),
      t.sit ? el('p', { cls: 'sm-sit', txt: t.sit }) : null,
      h,
    ]);
    if (t.tipo === 'info' && t.txt) bloco.appendChild(el('div', { cls: 'sm-info' }, t.txt.map(function (x) { return el('p', { txt: x }); })));
    return bloco;
  }

  // botões de resposta (escolha e escala)
  function opcoes(t, o) {
    o = o || {};
    var lista = el('div', { cls: 'sm-ops' + (t.tipo === 'escala' ? ' sm-escala' : '') + (t.ops.length === 2 ? ' sm-duas' : ''), role: 'group', 'aria-label': 'Respostas' });
    t.ops.forEach(function (txt, k) {
      var sel = o.marcada === k, certa = o.certa != null && o.certa === k, errada = sel && o.certa != null && !certa;
      var b = el('button', { type: 'button', cls: 'sm-op c' + k + (sel ? ' sel' : '') + (certa ? ' certa' : '') + (errada ? ' errada' : ''), 'aria-pressed': sel ? 'true' : 'false', disabled: o.desliga ? true : null,
        onclick: function () { if (o.escolhe) o.escolhe(k, b); } }, [
        el('span', { cls: 'sm-l', 'aria-hidden': 'true', txt: LETRAS[k] }), el('span', { cls: 'sm-ot', txt: txt }),
      ]);
      if (certa) b.appendChild(el('span', { cls: 'sm-ok', 'aria-hidden': 'true', txt: '✓' }));
      else if (errada) b.appendChild(el('span', { cls: 'sm-x', 'aria-hidden': 'true', txt: '✗' }));
      b.setAttribute('aria-label', LETRAS[k] + ': ' + txt + (sel ? ' (sua resposta)' : '') + (certa ? ' (resposta certa)' : ''));
      lista.appendChild(b);
    });
    return lista;
  }

  // nuvem: campo para até 3 palavras
  function nuvemCampo(t, o) {
    o = o || {};
    var enviadas = (o.enviadas || []).slice();
    var id = 'sm-nv-' + Math.random().toString(36).slice(2, 7);
    var inp = el('input', { id: id, type: 'text', maxlength: '28', autocomplete: 'off', autocapitalize: 'none', enterkeyhint: 'send', placeholder: t.ex || '' });
    var bt = el('button', { type: 'submit', cls: 'btn forte', txt: 'Enviar' });
    var chips = el('ul', { cls: 'sm-chips', 'aria-label': 'Palavras enviadas' });
    var aviso = el('p', { cls: 'sm-aviso', 'aria-live': 'polite' });
    function desenha() {
      chips.replaceChildren.apply(chips, enviadas.map(function (w) { return el('li', { txt: w }); }));
      var fim = enviadas.length >= 3 || o.desliga;
      inp.disabled = fim; bt.disabled = fim;
      aviso.textContent = enviadas.length ? (enviadas.length >= 3 ? 'Pronto: você mandou 3 palavras.' : 'Enviada. Pode mandar até ' + (3 - enviadas.length) + (3 - enviadas.length === 1 ? ' outra.' : ' outras.')) : 'Até 3 palavras, uma de cada vez. Ninguém vê quem escreveu.';
    }
    var f = el('form', { cls: 'sm-nuvem-f', onsubmit: function (e) {
      e.preventDefault();
      var w = inp.value.replace(/\s+/g, ' ').trim().toLocaleLowerCase('pt-BR').slice(0, 28);
      if (w.length < 2) { aviso.textContent = 'Escreva uma palavra.'; inp.focus(); return; }
      if (enviadas.indexOf(w) < 0) { enviadas.push(w); if (o.envia) o.envia(w); }
      inp.value = ''; desenha(); if (!inp.disabled) inp.focus();
    } }, [el('label', { for: id, cls: 'sm-rot', txt: 'Sua palavra' }), el('div', { cls: 'sm-linha' }, [inp, bt]), aviso, chips]);
    desenha();
    return f;
  }

  // ordenar: toque nos itens na ordem
  function ordenarCampo(t, o) {
    o = o || {};
    var ordem = (o.ordem || []).slice();
    var mostra = embaralha(t.ops.length, o.semente || 7);
    var caixa = el('div', { cls: 'sm-ordenar' });
    var aviso = el('p', { cls: 'sm-aviso', 'aria-live': 'polite' });
    var lista = el('div', { cls: 'sm-ops sm-ord', role: 'group', 'aria-label': 'Toque nos itens na ordem, do primeiro ao último' });
    var acoes = el('p', { cls: 'sm-acoes' });
    var limpa = el('button', { type: 'button', cls: 'btn', txt: 'Recomeçar', onclick: function () { ordem = []; desenha(); lista.querySelector('button').focus(); } });
    var envia = el('button', { type: 'button', cls: 'btn forte', txt: o.rotulo || 'Enviar a ordem', onclick: function () { if (ordem.length === t.ops.length && o.envia) o.envia(ordem.slice()); } });
    acoes.appendChild(limpa); acoes.appendChild(envia);
    function desenha() {
      lista.replaceChildren();
      mostra.forEach(function (k) {
        var pos = ordem.indexOf(k);
        var b = el('button', { type: 'button', cls: 'sm-op' + (pos >= 0 ? ' sel' : ''), disabled: o.desliga ? true : null, onclick: function () {
          var p = ordem.indexOf(k); if (p >= 0) ordem.splice(p, 1); else ordem.push(k); desenha(); var bs = lista.querySelectorAll('button'); bs[mostra.indexOf(k)].focus();
        } }, [el('span', { cls: 'sm-l', 'aria-hidden': 'true', txt: pos >= 0 ? String(pos + 1) : '·' }), el('span', { cls: 'sm-ot', txt: t.ops[k] })]);
        b.setAttribute('aria-label', (pos >= 0 ? 'Posição ' + (pos + 1) + ': ' : 'Sem posição: ') + t.ops[k]);
        lista.appendChild(b);
      });
      envia.disabled = ordem.length !== t.ops.length || !!o.desliga;
      limpa.disabled = !ordem.length || !!o.desliga;
      aviso.textContent = ordem.length === t.ops.length ? 'Ordem completa. Confira e envie.' : 'Toque no que vem primeiro, depois no segundo, e assim por diante. Faltam ' + (t.ops.length - ordem.length) + '.';
    }
    caixa.appendChild(aviso); caixa.appendChild(lista); caixa.appendChild(acoes);
    desenha();
    return caixa;
  }

  // ---------------------------------------------------------------- resultados
  function barras(t, cont, o) {
    o = o || {};
    var tot = cont.reduce(function (a, b) { return a + b; }, 0);
    var ul = el('ul', { cls: 'sm-barras' + (t.tipo === 'escala' ? ' sm-b-escala' : '') });
    t.ops.forEach(function (txt, k) {
      var certo = temCerta(t) && t.certa === k, alerta = t.alerta && t.alerta.indexOf(k) >= 0;
      var p = pct(cont[k], tot);
      var rot = (t.tipo === 'escala' ? '' : LETRAS[k] + ': ') + txt;
      ul.appendChild(el('li', { cls: 'c' + k + (certo ? ' certa' : '') + (temCerta(t) && !certo ? ' errada' : '') + (alerta ? ' alerta' : '') + (o.minha === k ? ' minha' : '') }, [
        el('span', { cls: 'sm-bt', 'aria-hidden': 'true' }, [t.tipo === 'escala' ? null : el('b', { cls: 'sm-l', txt: LETRAS[k] }),
          el('span', null, [txt, certo ? el('span', { cls: 'sm-ok', txt: ' ✓ certa' }) : null, o.minha === k ? el('span', { cls: 'sm-sua', txt: ' · sua resposta' }) : null])]),
        el('span', { cls: 'sm-bb', 'aria-hidden': 'true' }, [el('i', { style: 'width:' + (cont[k] ? Math.max(1.5, (cont[k] / tot) * 100) : 0) + '%' })]),
        el('span', { cls: 'sm-bp', 'aria-hidden': 'true', txt: p + '%' }),
        el('span', { cls: 'visually-hidden', txt: rot + ': ' + p + '%, ' + cont[k] + (cont[k] === 1 ? ' resposta' : ' respostas') + (certo ? '. Resposta certa.' : '') + (o.minha === k ? ' Sua resposta.' : '') }),
      ]));
    });
    return ul;
  }

  function nuvemRes(palavras, o) {
    o = o || {};
    var caixa = el('div', { cls: 'sm-nuvem' });
    if (!palavras || !palavras.length) { caixa.appendChild(el('p', { cls: 'sm-vazio', txt: o.vazio || 'As palavras aparecem aqui assim que chegarem.' })); return caixa; }
    var max = palavras[0][1], min = palavras[palavras.length - 1][1];
    // os maiores no meio: alterna esquerda e direita
    var ordem = [];
    palavras.slice(0, o.limite || 45).forEach(function (p, k) { if (k % 2) ordem.push(p); else ordem.unshift(p); });
    var ul = el('ul', { 'aria-label': 'Nuvem de palavras, das mais citadas para as menos citadas' });
    ordem.forEach(function (p, k) {
      var f = max === min ? 1 : (p[1] - min) / (max - min);
      var li = el('li', { cls: 'n' + (k % 6), style: 'font-size:' + (1 + f * 2.2).toFixed(2) + 'em' });
      if (o.oculta) {
        var b = el('button', { type: 'button', title: 'Esconder do telão', onclick: function () {
          if (b.getAttribute('data-conf')) { o.oculta(p[0]); li.remove(); return; }
          b.setAttribute('data-conf', '1'); b.querySelector('small').textContent = ' esconder?';
          setTimeout(function () { if (b.isConnected) { b.removeAttribute('data-conf'); b.querySelector('small').textContent = ''; } }, 3500);
        } }, [p[0], el('small', { txt: '' })]);
        b.setAttribute('aria-label', p[0] + ', ' + p[1] + (p[1] === 1 ? ' vez' : ' vezes') + '. Toque duas vezes para esconder do telão.');
        li.appendChild(b);
      } else {
        li.appendChild(document.createTextNode(p[0]));
        li.appendChild(el('span', { cls: 'visually-hidden', txt: ', ' + p[1] + (p[1] === 1 ? ' vez' : ' vezes') }));
      }
      ul.appendChild(li);
    });
    // leitor de tela: em ordem de frequência
    caixa.appendChild(ul);
    return caixa;
  }

  function ordemRes(t, media, o) {
    o = o || {};
    var itens = t.ops.map(function (x, k) { return { k: k, x: x, m: media ? media[k] : null }; });
    itens.sort(function (a, b) { return (a.m == null ? 99 : a.m) - (b.m == null ? 99 : b.m); });
    var ol = el('ol', { cls: 'sm-ordem' });
    itens.forEach(function (it, pos) {
      var certaPos = t.certa ? t.certa.indexOf(it.k) : -1;
      var bate = certaPos === pos;
      ol.appendChild(el('li', { cls: bate ? 'certa' : '' }, [
        el('span', { cls: 'sm-pos', 'aria-hidden': 'true', txt: String(pos + 1) }),
        el('span', { cls: 'sm-ox', txt: it.x }),
        el('span', { cls: 'sm-om', txt: it.m != null && !o.semMedia ? 'posição média ' + String(it.m).replace('.', ',') : '' }),
        certaPos >= 0 ? el('span', { cls: 'sm-oc', txt: bate ? '✓ ' + (certaPos + 1) + 'º' : 'na NR-1: ' + (certaPos + 1) + 'º' }) : null,
      ]));
    });
    return ol;
  }

  function resultado(t, res, o) {
    o = o || {};
    if (!res) return null;
    var caixa = el('div', { cls: 'sm-res' });
    var tot = res.total || 0;
    if (t.tipo === 'escala' && o.anonimo && tot > 0 && tot < 5) {
      caixa.appendChild(el('p', { cls: 'sm-vazio', txt: 'Para ninguém ser identificado, o resultado aparece a partir de 5 respostas. Até agora: ' + tot + '.' }));
      return caixa;
    }
    if (t.tipo === 'escolha' || t.tipo === 'escala') caixa.appendChild(barras(t, res.contagem || new Array(t.ops.length).fill(0), o));
    else if (t.tipo === 'nuvem') caixa.appendChild(nuvemRes(res.palavras, o));
    else if (t.tipo === 'ordenar') caixa.appendChild(ordemRes(t, res.media, o));
    if (t.tipo === 'escala' && t.alerta) caixa.appendChild(el('p', { cls: 'sm-legenda', txt: 'Em destaque, as respostas que pedem atenção.' }));
    return caixa;
  }

  // explicação depois de revelar; "minha" = resposta desta pessoa (opcional)
  function explicacao(t, o) {
    o = o || {};
    var caixa = el('div', { cls: 'sm-exp' });

<script>/* Vigie a Democracia · Sala ao vivo: o telão (quem apresenta) e o celular (a plateia).
   O telão cria a sala e recebe uma chave secreta; a plateia entra pelo QR code ou pelo código de 4 letras.
   A sala guarda só as respostas, sem nome: cada celular sorteia um número para não contar o mesmo voto duas vezes.

  // ---------------------------------------------------------------- conexão: WebSocket, com plano B por consulta

  // ================================================================ PLATEIA (celular)
