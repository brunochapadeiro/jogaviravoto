<script>window.SM_DADOS = {"jogos": [{"id": "vf", "publico": "abrir aulas, palestras e reuniões; qualquer público", "nivel": "comecar", "tipo": "Verdadeiro ou falso", "nome": "Verdadeiro ou falso? A NR-1 sem mitos", "curto": "A NR-1 sem mitos", "dur": "7 min", "cor": "#B3261E", "corEsc": "#FF8F84", "desc": "Avaliar a cabeça de cada um? Questionário obrigatório? Selo de empresa saudável dispensa a norma? Doze frases sobre os riscos psicossociais, com a resposta das Diretrizes da Fundacentro, do Manual do MTE e do Observatório.", "telas": [{"tipo": "escolha", "tag": "NR-1", "p": "A NR-1 manda a empresa avaliar a saúde mental de cada trabalhador.", "ops": ["Verdadeiro", "Falso"], "certa": 1, "exp": "Falso. As normas olham as condições, a organização e a gestão do trabalho, e não o estado psíquico das pessoas (Diretrizes da Fundacentro, pergunta 1). O Manual do MTE é explícito: não se trata de verificar sintomas individuais nem de medir sinal biológico.", "f": ["maeno", "manual"]}, {"tipo": "escolha", "tag": "Métodos", "p": "O MTE exige um questionário específico para avaliar os riscos psicossociais.", "ops": ["Verdadeiro", "Falso"], "certa": 1, "exp": "Falso. O MTE não define nem sugere metodologia. Se a empresa usar uma ferramenta, ela precisa de validação científica e de quem saiba aplicá-la e interpretá-la: “Aplicar um questionário sem o devido preparo não é gestão de risco” (Manual do MTE).", "f": ["manual"]}, {"tipo": "escolha", "tag": "NR-17", "p": "Microempresa dispensada do PGR também fica dispensada da avaliação ergonômica preliminar.", "ops": ["Verdadeiro", "Falso"], "certa": 1, "exp": "Falso. A AEP da NR-17 é obrigatória para todas as organizações, inclusive as dispensadas do PGR: “A dispensa de PGR não dispensa a AEP!” (Manual do MTE). As Diretrizes acrescentam: quem contrata um MEI deve incluí-lo quando ele trabalha em suas dependências.", "f": ["manual", "maeno"]}, {"tipo": "escolha", "tag": "Severidade", "p": "Para a severidade, o Manual do MTE manda avaliar pelo pior cenário possível.", "ops": ["Verdadeiro", "Falso"], "certa": 0, "exp": "Verdadeiro. É a “regra de ouro da severidade”. As Diretrizes da Fundacentro concluem que, para os riscos psicossociais, a severidade deve ser a mais alta, porque os transtornos mentais podem levar à incapacidade permanente e ao suicídio.", "f": ["manual", "maeno"]}, {"tipo": "escolha", "tag": "Subnotificação", "p": "Em 2024, menos de 3% dos benefícios por transtorno mental tiveram o nexo com o trabalho reconhecido.", "ops": ["Verdadeiro", "Falso"], "certa": 0, "exp": "Verdadeiro. Foram 9.600 casos, 2,04% do total, segundo as Diretrizes da Fundacentro. Com tanta subnotificação, o número de CATs não serve para dizer que a probabilidade de adoecer é baixa.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "ISO 45003", "p": "Empresa certificada pela ISO 45001, com a ISO 45003, tem baixo risco de adoecimento.", "ops": ["Verdadeiro", "Falso"], "certa": 1, "exp": "Falso. A ISO 45003 orienta a gestão dos riscos psicossociais e complementa a ISO 45001. Mas certificação não garante baixo risco: fiscalizações encontram não conformidades em empresas certificadas, e os trabalhadores raramente participam das auditorias (Diretrizes, pergunta 10).", "f": ["iso", "maeno"]}, {"tipo": "escolha", "tag": "Selos", "p": "O certificado de “empresa promotora da saúde mental” dispensa a NR-1.", "ops": ["Verdadeiro", "Falso"], "certa": 1, "exp": "Falso: não dispensa (Diretrizes, pergunta 15). Na IV Oficina do Observatório, a crítica foi que critérios frouxos de certificação podem dar prestígio a empresas que ignoram a organização do trabalho.", "f": ["maeno", "obsliv"]}, {"tipo": "escolha", "tag": "Medidas", "p": "É preciso desenhar uma medida para cada fator de risco identificado.", "ops": ["Verdadeiro", "Falso"], "certa": 1, "exp": "Falso. Os riscos não aparecem isolados: carga de trabalho, pressão por desempenho, baixa autonomia e insegurança se combinam e se potencializam. Uma medida pode atingir vários deles; o importante é enfrentar todos (Diretrizes, pergunta 14).", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Participação", "p": "A empresa pode obrigar cada trabalhador a responder ao questionário de riscos psicossociais.", "ops": ["Verdadeiro", "Falso"], "certa": 1, "exp": "Falso. Todos devem ser convidados e se sentir seguros, mas a participação é sempre voluntária, sem coerção (Diretrizes, pergunta 13). O Manual do MTE lembra: sem confiança e anonimato, o diagnóstico é falho.", "f": ["maeno", "manual"]}, {"tipo": "escolha", "tag": "Transparência", "p": "O inventário de riscos e o plano de ação devem estar disponíveis aos trabalhadores e aos sindicatos.", "ops": ["Verdadeiro", "Falso"], "certa": 0, "exp": "Verdadeiro: a NR-1 garante o acesso (item 1.5.7.2.1). As Diretrizes da Fundacentro vão além: o inventário só tem validade se for confirmado pelos trabalhadores e suas organizações.", "f": ["nr1", "maeno"]}, {"tipo": "escolha", "tag": "LDRT", "p": "A Lista de Doenças Relacionadas ao Trabalho, atualizada em 2023 e 2024, passou de 182 para 347 códigos.", "ops": ["Verdadeiro", "Falso"], "certa": 0, "exp": "Verdadeiro, depois de 24 anos sem revisão. Os transtornos mentais foram de 12 para 32 categorias, ligados a fatores como gestão organizacional, jornada, assédio e discriminação (livro do Observatório).", "f": ["obsliv", "ldrt"]}, {"tipo": "escolha", "tag": "STF", "p": "O STF derrubou a parte da NR-1 sobre riscos psicossociais.", "ops": ["Verdadeiro", "Falso"], "certa": 1, "exp": "Falso. O STF suspendeu só multas e autuações ligadas a cinco itens, enquanto busca um acordo (ADPF 1.316 e outras duas). A norma continua valendo, e a obrigação de prevenir também. Até 2/12/2026, a AGU recebe sugestões sobre a proposta do MTE.", "f": ["stf", "agu"]}], "nivelNome": "Para começar: aquecer a sala"}, {"id": "cenas", "publico": "turmas, CIPAs, sindicatos e equipes; leitura visual", "nivel": "comecar", "tipo": "Cenas ilustradas", "nome": "Leia a cena: o trabalho real", "curto": "Leia a cena", "dur": "9 min", "cor": "#1F4E8C", "corEsc": "#A6C8FF", "desc": "Nove cenas ilustradas de trabalho, inspiradas nos exemplos das Diretrizes da Fundacentro: teleatendimento, hospital, loja, aplicativo, banco. Em cada uma, que leitura vai à raiz do problema?", "telas": [{"tipo": "escolha", "cena": "tele", "tag": "NR-17 · ritmo", "sit": "Teleatendimento: o sistema manda a próxima ligação assim que a anterior acaba, com tempo médio cronometrado e 5 minutos de banheiro no dia todo.", "p": "O que esta cena mostra, na leitura da Saúde do Trabalhador?", "ops": ["Ritmo imposto pela máquina: a operadora perde o controle do próprio trabalho", "Falta de inteligência emocional da operadora", "Um “fator de risco” a marcar no checklist, sem mexer no sistema", "Nada: teleatendimento é assim mesmo"], "certa": 0, "exp": "O manual da NR-17 distingue a cadência do ritmo, que pode ser livre ou imposto. Aqui, quem dita o ritmo é a ferramenta que distribui as chamadas. As Diretrizes da Fundacentro perguntam como respeitar as condições físicas e psíquicas da operadora assim, e lembram: se uma máquina impõe o ritmo, só se diminui reprogramando a máquina.", "f": ["maeno", "nr17"]}, {"tipo": "escolha", "cena": "enfermagem", "tag": "Violência e organização", "sit": "Hospital, 3h40: uma técnica de enfermagem para 14 leitos, no segundo plantão seguido. Pacientes irritados chamam ao mesmo tempo, e as agressões são tratadas como “parte do ofício”.", "p": "Onde está a raiz do risco?", "ops": ["Na organização: pouca gente, regras impostas sem diálogo e nenhum apoio imediato", "Na “natureza” dos pacientes, que não muda", "Na falta de vocação da técnica", "Na falta de um curso de defesa pessoal"], "certa": 0, "exp": "As Diretrizes da Fundacentro analisam um caso assim: escassez de pessoal, regras disciplinares verticais e falta de meios para pedir ajuda produzem a violência que depois é naturalizada. Não são eventos isolados, mas um problema estrutural da organização do trabalho e da gestão.", "f": ["maeno"]}, {"tipo": "escolha", "cena": "vendas", "tag": "Psicologia Social do Trabalho", "sit": "Loja: ranking do mês na parede, e quem fica em último vira a “lanterna” diante da equipe.", "p": "Que processo esta prática alimenta?", "ops": ["Competição que quebra a cooperação e a solidariedade do coletivo", "Motivação saudável, que melhora o clima", "Só um problema de autoestima de quem ficou em último", "Um conflito pessoal entre vendedores"], "certa": 0, "exp": "Ranqueamento e exposição pública estão na lista de práticas organizacionais violentas que se naturalizam, segundo as Diretrizes da Fundacentro. Avaliação que põe colega contra colega é indício de trabalho penoso: esgarça as redes de colaboração e solidariedade, que protegem a saúde.", "f": ["maeno"]}, {"tipo": "escolha", "cena": "entregador", "tag": "Saúde do Trabalhador", "sit": "Entregador de aplicativo, 22h47: 15 segundos para aceitar a corrida, aviso de que a taxa de aceitação caiu e risco de bloqueio.", "p": "Por que a “liberdade” deste trabalho é aparente?", "ops": ["A plataforma define preço, ritmo e punição, com regras vagas que mudam sem aviso", "Ele não sabe gerir o próprio negócio", "Ele trabalha à noite", "Não é aparente: ele escolhe a hora de ligar o aplicativo"], "certa": 0, "exp": "No exemplo das Diretrizes, termos vagos permitem bloqueios por “má conduta” nunca definida, e o valor de cada entrega é fixado sem critérios conhecidos. Trabalhar sob esse arbítrio é altamente prejudicial à saúde mental. O livro do Observatório chama isso, com Ludmila Abílio, de autogerenciamento subordinado.", "f": ["maeno", "obsliv"]}, {"tipo": "escolha", "cena": "remoto", "tag": "SMRT", "sit": "Teletrabalho, 23h17: 14 mensagens no grupo da equipe pedindo uma tarefa para amanhã cedo.", "p": "Como as Diretrizes da Fundacentro classificam esta situação?", "ops": ["Violência organizacional naturalizada: não conseguir se desconectar", "Flexibilidade: ela escolheu trabalhar de casa", "Problema de gestão do tempo da trabalhadora", "Risco ergonômico da cadeira de casa"], "certa": 0, "exp": "Não poder se desconectar nas horas de descanso e nas férias está entre as práticas violentas que se naturalizam no trabalho. Sem tempo de recuperação, o desgaste mental se acumula. A mudança está na organização: prazos possíveis e regras de contato combinadas com a equipe.", "f": ["maeno"]}, {"tipo": "escolha", "cena": "caixa", "tag": "C190 e R206 da OIT", "sit": "Supermercado: fila de 12 pessoas, um cliente grita com a operadora de caixa, e o fiscal chamado há 10 minutos não aparece.", "p": "O que a Recomendação 206 da OIT manda olhar na avaliação de riscos?", "ops": ["Os riscos que envolvem terceiros, como clientes, e as condições de trabalho que os favorecem", "Só a conduta da operadora no atendimento", "Nada: violência de cliente não é risco do trabalho", "Só o que acontece entre colegas"], "certa": 0, "exp": "A R206 pede atenção aos riscos que surgem das condições e da organização do trabalho, aos que envolvem terceiros (clientes, usuários, pacientes) e aos que vêm de discriminação e abuso de poder. Fila longa e caixa sem retaguarda são escolhas de organização; treinar “paciência” transfere o risco para quem sofre a violência.", "f": ["maeno"]}, {"tipo": "escolha", "cena": "mudanca", "tag": "NR-1 · reavaliação", "sit": "Escritório: sistema novo na segunda, sem treinamento, com as mesmas metas.", "p": "Isso exige refazer a avaliação de riscos psicossociais antes dos dois anos?", "ops": ["Sim: mudança organizacional que altera as condições já avaliadas justifica nova avaliação", "Não: a NR-1 só pede revisão a cada dois anos", "Só se alguém se afastar", "Só se o sindicato pedir por escrito"], "certa": 0, "exp": "A avaliação é contínua (NR-1, item 1.5.4.4.6). As Diretrizes listam automação, redução de efetivo, acúmulo de funções e troca entre remoto e presencial como razões suficientes para reavaliar antes do prazo. Esperar o afastamento inverte a prevenção.", "f": ["nr1", "maeno"]}, {"tipo": "escolha", "cena": "retorno", "tag": "Psicologia Social do Trabalho", "sit": "Volta do afastamento: mesa no corredor, ao lado do depósito, sem computador e sem tarefas.", "p": "Que indício de trabalho penoso aparece aqui?", "ops": ["Desqualificação: esvaziar funções e isolar quem volta de afastamento", "Cuidado para a pessoa se readaptar aos poucos", "Excesso de demandas", "Nenhum: era a única mesa livre"], "certa": 0, "exp": "Discriminar quem retorna de afastamento por saúde e esvaziar funções estão entre os indícios de trabalho penoso das Diretrizes, a partir de Leny Sato. A mensagem é de que o trabalho da pessoa não tem valor, e muitas vezes empurra para o pedido de demissão durante a estabilidade. Retorno se planeja com a pessoa.", "f": ["maeno"]}, {"tipo": "escolha", "cena": "agencia", "tag": "SMRT · conflito de valores", "sit": "Agência bancária: o ranking do dia sai no grupo às 20h, a meta de amanhã sobe 10%, e para bater a meta é preciso vender seguros a correntistas idosos que não precisam deles.", "p": "Que sofrimento esta meta produz?", "ops": ["Conflito de valores: fazer o que a ética do ofício condena para bater a meta", "Nenhum: vender é a função do gerente", "Só cansaço físico", "Falta de talento comercial"], "certa": 0, "exp": "No exemplo das Diretrizes, o gerente é pressionado a vender o que não serve ao cliente e adoece de vergonha e tensão. Quando a tarefa afronta a ética profissional, a análise não é “subjetiva” e deve envolver a representação dos trabalhadores. O conflito de valores é fonte reconhecida de sofrimento.", "f": ["maeno"]}, {"tipo": "info", "tag": "Para fechar", "p": "O que as cenas têm em comum", "txt": ["Em nenhuma delas o problema é um “fator” solto ou uma fraqueza de quem trabalha. Os riscos psicossociais derivam de como o trabalho é gerido, planejado, prescrito, cobrado e organizado.", "“A fonte dos riscos psicossociais relacionados ao trabalho não está no indivíduo, mas sim na organização do trabalho.” (Manual do MTE)", "Por isso, quem conhece o trabalho real precisa estar na análise e na mudança."], "f": ["maeno", "manual"]}], "nivelNome": "Para começar: aquecer a sala"}, {"id": "leituras", "publico": "formação de equipes de SST, RH e gestão; estudantes", "nivel": "comecar", "tipo": "Classificação", "nome": "Pessoa, fator ou processo?", "curto": "Pessoa, fator ou processo", "dur": "6 min", "cor": "#5B3FA0", "corEsc": "#C9B8FF", "desc": "Três jeitos de ler os riscos psicossociais: culpar a pessoa, isolar um “fator” ou analisar o processo de trabalho. Dez práticas reais para classificar, a partir das Diretrizes da Fundacentro e da crítica do Observatório.", "telas": [{"tipo": "info", "tag": "Como funciona", "p": "Três leituras do mesmo problema", "txt": ["Individualiza: põe o problema, e a solução, na pessoa, com testes, palestras e “resiliência”.", "Isola o “fator”: trata o risco como um agente solto, a medir e registrar como o ruído, sem mexer na organização.", "Lê o processo: analisa, com quem trabalha, como o trabalho é gerido, planejado, prescrito, cobrado e organizado."], "f": ["maeno"]}, {"tipo": "escolha", "tag": "Que leitura é esta?", "p": "Aplicar um teste de tolerância ao estresse em todos os empregados.", "ops": ["Individualiza: põe na pessoa", "Isola o “fator”, sem contexto", "Lê o processo de trabalho"], "certa": 0, "exp": "Individualiza. É a primeira leitura enviesada descrita nas Diretrizes da Fundacentro: avaliações psicológicas e medidas da “capacidade de enfrentamento”, sem tocar nas condições de trabalho. A NR-1 não avalia pessoas: avalia condições, organização e gestão do trabalho.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Que leitura é esta?", "p": "Definir um “limite de tolerância” para o assédio, como se faz com o ruído.", "ops": ["Individualiza: põe na pessoa", "Isola o “fator”, sem contexto", "Lê o processo de trabalho"], "certa": 1, "exp": "Isola o fator. Quais seriam as “doses” toleráveis de assédio, racismo ou ameaça ao emprego?, perguntam as Diretrizes. Medir o “grau” da violência acaba por legitimar parte dela como tolerável. O Observatório lembra que, aqui, não há limite de tolerância nem EPI.", "f": ["maeno", "obs"]}, {"tipo": "escolha", "tag": "Que leitura é esta?", "p": "Investigar com a equipe quem decide as metas, como elas sobem e o que acontece com quem não as cumpre.", "ops": ["Individualiza: põe na pessoa", "Isola o “fator”, sem contexto", "Lê o processo de trabalho"], "certa": 2, "exp": "Lê o processo. A pressão por resultados não é fator isolado: é uma relação de poder que coage, intensifica o trabalho e fragmenta o coletivo. Analisar o processo é perguntar de onde vem a meta, como é negociada e o que ela faz com o trabalho.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Que leitura é esta?", "p": "Oferecer o “EPI da saúde mental”: aplicativo de meditação e sala de descompressão.", "ops": ["Individualiza: põe na pessoa", "Isola o “fator”, sem contexto", "Lê o processo de trabalho"], "certa": 0, "exp": "Individualiza. As Diretrizes chamam essas medidas de inadequadas: individualizam o sofrimento e transferem ao trabalhador a responsabilidade pela própria saúde, como na culpabilização da vítima nos acidentes de trabalho.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Que leitura é esta?", "p": "Registrar “falta de realização profissional” como fator de risco no questionário, sem perguntar o que, no trabalho, impede a realização.", "ops": ["Individualiza: põe na pessoa", "Isola o “fator”, sem contexto", "Lê o processo de trabalho"], "certa": 1, "exp": "Isola o fator. É o exemplo das Diretrizes: tratada como fator solto, a falta de realização vira falha das pessoas e acaba em palestra motivacional. Lida como processo, aponta para metas inalcançáveis, falta de participação, avaliação injusta e carreira travada.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Que leitura é esta?", "p": "Classificar os riscos psicossociais por grupo homogêneo de exposição e ranquear os setores pela pontuação.", "ops": ["Individualiza: põe na pessoa", "Isola o “fator”, sem contexto", "Lê o processo de trabalho"], "certa": 1, "exp": "Isola o fator. O Observatório critica encaixar esses riscos na matriz quantitativa da higiene ocupacional: todos estão expostos, e não há grupos homogêneos de risco, limite de tolerância nem EPI. Números ajudam, mas não substituem a análise do trabalho.", "f": ["obs"]}, {"tipo": "escolha", "tag": "Que leitura é esta?", "p": "Explicar os gritos e as humilhações da chefia com “ele é assim mesmo”.", "ops": ["Individualiza: põe na pessoa", "Isola o “fator”, sem contexto", "Lê o processo de trabalho"], "certa": 0, "exp": "Individualiza. Gritos e hostilidade costumam ser naturalizados como traço de personalidade, dizem as Diretrizes. A análise pede olhar o modelo de gestão e a pressão por metas que atravessa toda a hierarquia.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Que leitura é esta?", "p": "Apurar cada denúncia de assédio só para punir o assediador, caso a caso.", "ops": ["Individualiza: põe na pessoa", "Isola o “fator”, sem contexto", "Lê o processo de trabalho"], "certa": 0, "exp": "Individualiza, agora do lado de quem assedia. Na maioria das vezes, dizem as Diretrizes, esses comportamentos expressam pressões organizacionais. A apuração deve identificar também o que, na gestão e na organização do trabalho, precisa mudar.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Que leitura é esta?", "p": "Cruzar rotatividade, afastamentos, terceirização e indícios de trabalho penoso, num comitê de trabalhadores e empresa.", "ops": ["Individualiza: põe na pessoa", "Isola o “fator”, sem contexto", "Lê o processo de trabalho"], "certa": 2, "exp": "Lê o processo. São os três eixos de análise das Diretrizes (dados externos, indícios de trabalho penoso e documentos da empresa), lidos juntos pelo Comitê Permanente de Organização do Trabalho e Saúde.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Que leitura é esta?", "p": "Ouvir os operadores sobre as regras não escritas que mandam produzir mesmo com a máquina falhando.", "ops": ["Individualiza: põe na pessoa", "Isola o “fator”, sem contexto", "Lê o processo de trabalho"], "certa": 2, "exp": "Lê o processo: é ir ao trabalho real, ao choque entre a norma oficial e a pressão por produção que só quem trabalha conhece. Na tradição da Saúde do Trabalhador, a experiência operária é fonte de conhecimento, como na comunidade científica ampliada de Ivar Oddone.", "f": ["maeno", "obsliv"]}], "nivelNome": "Para começar: aquecer a sala"}, {"id": "nr17", "publico": "ergonomistas, equipes de SST e auditores", "nivel": "analisar", "tipo": "Classificação", "nome": "A lente da NR-17: onde está o problema?", "curto": "A lente da NR-17", "dur": "8 min", "cor": "#17695F", "corEsc": "#5FD3C2", "desc": "Dez situações reais, dos exemplos das Diretrizes da Fundacentro. Em que aspecto da organização do trabalho (NR-17, item 17.4.1) está a raiz: normas de produção, modo operatório, tempo, ritmo, conteúdo ou exigências cognitivas?", "telas": [{"tipo": "info", "tag": "Como funciona", "p": "Seis lentes para a organização do trabalho", "txt": ["O item 17.4.1 da NR-17 manda considerar as normas de produção, o modo operatório, a exigência de tempo, o ritmo, o conteúdo das tarefas com os meios técnicos e os aspectos cognitivos.", "Os itens se entrelaçam. Escolha o principal: a explicação mostra onde as Diretrizes da Fundacentro situam cada caso."], "f": ["nr17", "maeno"]}, {"tipo": "escolha", "tag": "Onde está a raiz? NR-17, item 17.4.1", "p": "Fábrica: a chefia cobra a meta mesmo com a máquina falhando. Se houver acidente, a culpa é do operador.", "ops": ["Normas de produção", "Modo operatório", "Exigência de tempo", "Ritmo de trabalho", "Conteúdo das tarefas e meios técnicos", "Aspectos cognitivos"], "certa": 0, "exp": "Normas de produção: o choque entre a norma formal e as normas implícitas, que priorizam produzir. A escolha do trabalhador é só aparente; é uma imposição, velada ou não. E, no acidente, a culpa recai sobre ele.", "f": ["maeno", "nr17"]}, {"tipo": "escolha", "tag": "Onde está a raiz? NR-17, item 17.4.1", "p": "Galpão: o tablet impõe a ordem da coleta. O trabalhador cria um caminho melhor, mas trabalha com medo das câmeras.", "ops": ["Normas de produção", "Modo operatório", "Exigência de tempo", "Ritmo de trabalho", "Conteúdo das tarefas e meios técnicos", "Aspectos cognitivos"], "certa": 1, "exp": "Modo operatório. Organização adequada é a que dá autonomia, individual e coletiva, para adaptar o modo de fazer à variabilidade real. Procedimento rígido com vigilância e punição tende a favorecer acidentes e adoecimento.", "f": ["maeno", "nr17"]}, {"tipo": "escolha", "tag": "Onde está a raiz? NR-17, item 17.4.1", "p": "Loja: os vendedores são proibidos de sentar, para “passar prontidão” aos clientes.", "ops": ["Normas de produção", "Modo operatório", "Exigência de tempo", "Ritmo de trabalho", "Conteúdo das tarefas e meios técnicos", "Aspectos cognitivos"], "certa": 1, "exp": "Modo operatório. A proibição gera desgaste físico desnecessário e mostra desvalorização das necessidades humanas, com efeitos no corpo e na saúde psíquica, segundo as Diretrizes.", "f": ["maeno", "nr17"]}, {"tipo": "escolha", "tag": "Onde está a raiz? NR-17, item 17.4.1", "p": "Laboratório: a planilha de tempo médio ignora preparo, calibragem e máquina quebrada. Quem demora é visto como “lento”.", "ops": ["Normas de produção", "Modo operatório", "Exigência de tempo", "Ritmo de trabalho", "Conteúdo das tarefas e meios técnicos", "Aspectos cognitivos"], "certa": 2, "exp": "Exigência de tempo. O tempo prescrito ignora o trabalho real, feito de ações invisíveis que fazem o resultado acontecer. A diferença vira “morosidade a corrigir”, e não erro de planejamento.", "f": ["maeno", "nr17"]}, {"tipo": "escolha", "tag": "Onde está a raiz? NR-17, item 17.4.1", "p": "Garagem de ônibus: a manutenção é pressionada a liberar veículos sem a revisão preventiva, para cumprir o horário.", "ops": ["Normas de produção", "Modo operatório", "Exigência de tempo", "Ritmo de trabalho", "Conteúdo das tarefas e meios técnicos", "Aspectos cognitivos"], "certa": 2, "exp": "Exigência de tempo, com um dilema ético: o trabalhador sabe do perigo para os passageiros, mas se sente obrigado a seguir ordens que contrariam sua responsabilidade profissional. Esse conflito gera sofrimento.", "f": ["maeno", "nr17"]}, {"tipo": "escolha", "tag": "Onde está a raiz? NR-17, item 17.4.1", "p": "Escola: com prazo para fechar as notas, a professora é escalada para organizar a festa e acelera as correções.", "ops": ["Normas de produção", "Modo operatório", "Exigência de tempo", "Ritmo de trabalho", "Conteúdo das tarefas e meios técnicos", "Aspectos cognitivos"], "certa": 3, "exp": "Ritmo de trabalho. O ritmo pode ser imposto por máquinas, metas, recompensas e pelo acúmulo de tarefas. As Diretrizes pedem olhar não só o ritmo atual, mas os mecanismos usados ao longo do tempo para intensificá-lo.", "f": ["maeno", "nr17"]}, {"tipo": "escolha", "tag": "Onde está a raiz? NR-17, item 17.4.1", "p": "Loja: para bater uma meta impossível, a vendedora cria um grupo de WhatsApp com clientes e se divide entre o balcão e o celular.", "ops": ["Normas de produção", "Modo operatório", "Exigência de tempo", "Ritmo de trabalho", "Conteúdo das tarefas e meios técnicos", "Aspectos cognitivos"], "certa": 3, "exp": "Ritmo de trabalho. Ela intensifica o próprio ritmo para dar conta da meta, sem que isso esteja prescrito. Se todos fizessem igual, disputariam os mesmos clientes: a meta gera animosidade e conflito no coletivo.", "f": ["maeno", "nr17"]}, {"tipo": "escolha", "tag": "Onde está a raiz? NR-17, item 17.4.1", "p": "Faculdade: um método de ensino padronizado é imposto, e as notas dos alunos passam a contar na avaliação docente.", "ops": ["Normas de produção", "Modo operatório", "Exigência de tempo", "Ritmo de trabalho", "Conteúdo das tarefas e meios técnicos", "Aspectos cognitivos"], "certa": 4, "exp": "Conteúdo das tarefas. A padronização, feita para facilitar a troca de professores, tira autonomia sobre o que e como ensinar, e a professora perde, aos poucos, o prazer no ofício. Quando a meta desfigura o objetivo da tarefa, a avaliação se baseia em elementos objetivos e deve envolver a representação dos trabalhadores.", "f": ["maeno", "nr17"]}, {"tipo": "escolha", "tag": "Onde está a raiz? NR-17, item 17.4.1", "p": "Clínica: a recepcionista agenda os médicos enquanto atende balcão, telefone e WhatsApp, e faz a planilha na hora do almoço.", "ops": ["Normas de produção", "Modo operatório", "Exigência de tempo", "Ritmo de trabalho", "Conteúdo das tarefas e meios técnicos", "Aspectos cognitivos"], "certa": 5, "exp": "Aspectos cognitivos, que não são só atributos individuais: interrupções, tarefas simultâneas e microdecisões contínuas tornam a exaustão previsível. Ela sacrifica uma pausa necessária. A saída é reorganizar fluxos e dimensionar demanda e capacidade de resposta.", "f": ["maeno", "nr17"]}, {"tipo": "escolha", "tag": "Onde está a raiz? NR-17, item 17.4.1", "p": "Prédio: com câmeras e portão automático, o condomínio demite um porteiro e a faxineira. O que ficou acumula portaria e limpeza.", "ops": ["Normas de produção", "Modo operatório", "Exigência de tempo", "Ritmo de trabalho", "Conteúdo das tarefas e meios técnicos", "Aspectos cognitivos"], "certa": 5, "exp": "Aspectos cognitivos. A atenção à portaria é interrompida o tempo todo, e ele sofre por não conseguir mais ajudar os moradores idosos. A “modernização” trouxe sobrecarga física, cognitiva e psíquica.", "f": ["maeno", "nr17"]}], "nivelNome": "Para analisar o trabalho"}, {"id": "intervencao", "publico": "ergonomistas, psicólogas e psicólogos, SESMT e consultorias", "nivel": "analisar", "tipo": "Percurso da avaliação", "nome": "Da identificação à intervenção: AEP, AET e plano de ação", "curto": "Da identificação à intervenção", "dur": "9 min", "cor": "#0F5C8C", "corEsc": "#8CCBF0", "desc": "O percurso de quem avalia: o que é um fator de risco psicossocial, o que o questionário mede, por onde a AEP começa, quando aprofundar com a AET e como saber se a medida funcionou. Com a NR-1, a NR-17, a ISO 45003, o Manual do MTE e as Diretrizes da Fundacentro.", "telas": [{"tipo": "nuvem", "tag": "Para aquecer", "p": "Em uma palavra: o que mais adoece no trabalho hoje?", "ex": "ex.: metas", "exp": "Repare quantas palavras falam da organização do trabalho (metas, ritmo, chefia, jornada) e quantas falam das pessoas. “A fonte dos riscos psicossociais relacionados ao trabalho não está no indivíduo, mas sim na organização do trabalho” (Manual do MTE).", "f": ["manual"]}, {"tipo": "escolha", "tag": "Conceito", "p": "Um fator de risco psicossocial relacionado ao trabalho é…", "ops": ["Um aspecto de como o trabalho é concebido, organizado e gerido que pode causar dano", "Um traço de personalidade que deixa a pessoa vulnerável", "Um sintoma de estresse do trabalhador"], "certa": 0, "exp": "A ISO 45003 agrupa os perigos psicossociais em três blocos: a organização do trabalho, os fatores sociais no trabalho e o ambiente, os equipamentos e as tarefas perigosas. As Diretrizes da Fundacentro dão um passo além: são processos, de como o trabalho é gerido, planejado, prescrito, cobrado e organizado, e não fatores soltos nem traços das pessoas.", "f": ["iso", "maeno"]}, {"tipo": "escolha", "tag": "Proteção ou risco?", "p": "Metas compreensíveis, alcançáveis e negociadas com a equipe são…", "ops": ["Fator de proteção", "Fator de risco", "Depende de quem é cobrado"], "certa": 0, "exp": "O mesmo aspecto do trabalho pode proteger ou adoecer. Metas negociadas protegem; metas abusivas, com ranking e exposição pública, viram violência naturalizada, segundo as Diretrizes da Fundacentro. Por isso a avaliação pergunta como a meta é definida, e não só se ela existe.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Questionário", "p": "O questionário de riscos psicossociais mede…", "ops": ["Percepções: ajuda, mas avaliar o risco exige mais", "O risco, por si só", "A saúde mental de cada um"], "certa": 0, "exp": "Para estimar a probabilidade, a NR-1 manda considerar as exigências da atividade e a eficácia das medidas (item 1.5.4.4.5.3); o questionário ajuda a ver as primeiras, não mede a segunda. O Manual do MTE avisa que ferramenta exige validação e competência para interpretar, e as Diretrizes pedem juntar números, conversa e participação.", "f": ["manual", "maeno"]}, {"tipo": "escolha", "tag": "AEP", "p": "Na avaliação ergonômica preliminar, o ponto de partida para os riscos psicossociais é…", "ops": ["A organização do trabalho", "O grupo homogêneo de exposição da higiene ocupacional", "O perfil de cada trabalhador"], "certa": 0, "exp": "A NR-17 manda considerar normas de produção, modo operatório, tempo, ritmo, conteúdo das tarefas e aspectos cognitivos (item 17.4.1). Os resultados vão para o coletivo e as situações de trabalho, sem individualizar. O Observatório lembra que aqui não há grupos homogêneos de risco, limite de tolerância nem EPI.", "f": ["nr17", "obs"]}, {"tipo": "escolha", "tag": "Do trabalho ou da pessoa?", "p": "O mesmo sinal aparece em várias pessoas da mesma área, logo depois de uma nova meta. Isso aponta para…", "ops": ["O trabalho", "A pessoa", "Coincidência"], "certa": 0, "exp": "Casos em série raramente são exceção: as Diretrizes da Fundacentro pedem tratá-los como evento sentinela e investigar o contexto de trabalho. Um caso isolado pede acolher e encaminhar, sem deixar de olhar o trabalho; e nenhum instrumento separa o peso do pessoal e o do trabalho (pergunta 8).", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Estudo de caso", "sit": "Uma indústria foi avaliada em dois anos seguidos. Entre as duas avaliações, toda a direção e a gerência mudaram.", "p": "Os casos suspeitos de transtorno mental comum (SRQ-20)…", "ops": ["Subiram de 10% para 27%", "Ficaram iguais", "Caíram pela metade"], "certa": 0, "exp": "Subiram de 10% para 27% (p = 0,0098), e o apoio social baixo foi de 52,9% para 65,7% (Lopes e De Lucca, 2026). Mudança organizacional é motivo para reavaliar os riscos antes do prazo de dois anos, dizem as Diretrizes da Fundacentro.", "f": ["lopes26", "maeno"]}, {"tipo": "escolha", "tag": "Da AEP à AET", "p": "A AEP aponta risco alto e há afastamentos por transtornos mentais e osteomusculares. E agora?", "ops": ["Aprofundar com a AET e investigar o nexo", "Arquivar: a AEP já cumpriu a norma", "Aplicar mais um questionário"], "certa": 0, "exp": "A NR-17 pede AET quando é preciso aprofundar a avaliação, quando as medidas se mostram insuficientes e quando a análise de doenças aponta causa nas condições de trabalho (item 17.3.2). A AET olha a atividade real e devolve e valida os resultados com quem trabalha.", "f": ["nr17"]}, {"tipo": "escolha", "tag": "Acompanhar", "p": "Como saber se a medida funcionou?", "ops": ["Acompanhar indicadores com quem trabalha e reavaliar", "Contar quantos assistiram à palestra", "Esperar a próxima avaliação, daqui a dois anos"], "certa": 0, "exp": "A NR-1 manda acompanhar o controle dos riscos (item 1.5.3.2, alínea f) e reavaliar quando as medidas não funcionam. As Diretrizes propõem que o comitê de empresa e trabalhadores acompanhe a implementação, com afastamentos, rotatividade, indícios de trabalho penoso e a palavra de quem trabalha.", "f": ["nr1", "maeno"]}, {"tipo": "escolha", "tag": "Para o debate", "p": "Até onde vai a ergonomia, e onde entra a psicologia?", "ops": ["A ergonomia conduz AEP e AET; a psicologia apoia", "Equipe multiprofissional, com coordenação compartilhada", "Trabalhadores no centro, equipe técnica a serviço", "Não sei"], "certa": null, "exp": "Não há resposta certa: é um debate vivo. O MTE recomenda abordagem multidisciplinar e deixa a estratégia à organização; a Resolução CFP 14/2023 orienta a psicologia; as Diretrizes da Fundacentro propõem um comitê de empresa e trabalhadores e lembram que nada substitui quem conhece o trabalho real.", "f": ["manual", "cfp", "maeno"]}, {"tipo": "nuvem", "tag": "Para levar", "p": "Em uma palavra: o que você leva para a sua próxima avaliação de riscos?", "ex": "ex.: escuta", "exp": "Identificar fatores não basta: é preciso compreender o trabalho que os produz e transformar, com quem trabalha, as condições que os sustentam.", "f": ["maeno"]}], "nivelNome": "Para analisar o trabalho"}, {"id": "degraus", "publico": "SST, RH, gestão, CIPA e sindicatos", "nivel": "analisar", "tipo": "Classificação", "nome": "Os degraus da prevenção", "curto": "Degraus da prevenção", "dur": "7 min", "cor": "#9A5F0C", "corEsc": "#F0B05A", "desc": "Notificar transtorno mental é proteção coletiva? Meditação é prevenção? Onze medidas reais para pôr no degrau certo da NR-1, com a figura das Diretrizes da Fundacentro.", "telas": [{"tipo": "info", "tag": "Como funciona", "p": "A ordem da NR-1 (item 1.4.1, alínea g)", "txt": ["1º eliminar os fatores de risco; 2º proteção coletiva; 3º medidas administrativas ou de organização do trabalho; 4º proteção individual.", "As Diretrizes da Fundacentro aplicam essa ordem aos riscos psicossociais. Em que degrau está cada medida?"], "f": ["nr1", "maeno"]}, {"tipo": "escolha", "tag": "Em que degrau?", "p": "Reduzir a jornada sem aumentar as demandas de trabalho.", "ops": ["1º Eliminação", "2º Proteção coletiva", "3º Administrativa ou de organização", "4º Proteção individual"], "certa": 0, "exp": "Topo da escada: elimina a exposição na fonte. A Flaskô, fábrica sob gestão operária relatada nas Diretrizes, reduziu a jornada para 30 horas semanais sem reduzir salários.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Em que degrau?", "p": "Eliminar metas e prazos altamente exigentes.", "ops": ["1º Eliminação", "2º Proteção coletiva", "3º Administrativa ou de organização", "4º Proteção individual"], "certa": 0, "exp": "Eliminação: muda o processo e os métodos de trabalho que produzem o risco. As Diretrizes põem a raiz dos adoecimentos em jornadas exaustivas, metas que pressionam toda a hierarquia e remuneração por desempenho individual.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Em que degrau?", "p": "Notificar os transtornos mentais relacionados ao trabalho (CAT e Sinan).", "ops": ["1º Eliminação", "2º Proteção coletiva", "3º Administrativa ou de organização", "4º Proteção individual"], "certa": 1, "exp": "Proteção coletiva, o que surpreende muita gente. A notificação garante direitos de cada trabalhador e, feita pela própria empresa, torna o adoecimento visível para a vigilância.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Em que degrau?", "p": "Proteger denunciantes e testemunhas de retaliação.", "ops": ["1º Eliminação", "2º Proteção coletiva", "3º Administrativa ou de organização", "4º Proteção individual"], "certa": 1, "exp": "Proteção coletiva. Sem ela, ninguém fala, e o diagnóstico sai distorcido. As Diretrizes pedem que vítimas e testemunhas não sejam demitidas durante nem depois da apuração.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Em que degrau?", "p": "Tirar de assediadores confirmados o poder sobre avaliações e transferências.", "ops": ["1º Eliminação", "2º Proteção coletiva", "3º Administrativa ou de organização", "4º Proteção individual"], "certa": 1, "exp": "Proteção coletiva: retira os instrumentos de gestão que permitem chantagem e retaliação contra subordinados.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Em que degrau?", "p": "Negociar metas e prazos com a equipe.", "ops": ["1º Eliminação", "2º Proteção coletiva", "3º Administrativa ou de organização", "4º Proteção individual"], "certa": 2, "exp": "Medida administrativa ou de organização do trabalho, ao lado da gestão participativa e dos critérios de prioridade definidos em conjunto.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Em que degrau?", "p": "Trocar a avaliação de desempenho individual ligada ao salário por autoavaliações coletivas do trabalho.", "ops": ["1º Eliminação", "2º Proteção coletiva", "3º Administrativa ou de organização", "4º Proteção individual"], "certa": 2, "exp": "Organização do trabalho. A avaliação individual vinculada à remuneração estimula a competição e quebra a cooperação; a coletiva devolve o trabalho ao centro da conversa.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Em que degrau?", "p": "Dimensionar o número de trabalhadores pela demanda real.", "ops": ["1º Eliminação", "2º Proteção coletiva", "3º Administrativa ou de organização", "4º Proteção individual"], "certa": 2, "exp": "Organização do trabalho: uma relação equilibrada entre o tamanho da equipe e a demanda. A redução de efetivo ao longo dos anos é, para as Diretrizes, um indicador importante de precarização.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Em que degrau?", "p": "Atendimento psicológico e psiquiátrico para quem precisa.", "ops": ["1º Eliminação", "2º Proteção coletiva", "3º Administrativa ou de organização", "4º Proteção individual"], "certa": 3, "exp": "Proteção individual. É de extrema relevância, mas não é prevenção: ampara quem já sofre. A empresa deve facilitar o acesso, liberar horário na jornada e garantir sigilo e livre escolha do profissional.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Em que degrau?", "p": "Campanha de Setembro Amarelo e palestra na SIPAT.", "ops": ["1º Eliminação", "2º Proteção coletiva", "3º Administrativa ou de organização", "4º Proteção individual"], "certa": 3, "exp": "Proteção individual, ainda que atinja muita gente: tem abordagem individualizante e aprendizagem passiva. Sensibilizar quem, e sobre o quê?, perguntam as Diretrizes.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Em que degrau?", "p": "Sala de descompressão com jogos e técnicas de relaxamento.", "ops": ["1º Eliminação", "2º Proteção coletiva", "3º Administrativa ou de organização", "4º Proteção individual"], "certa": 3, "exp": "Proteção individual. Parte do pressuposto de que o contexto é imutável e só resta sobreviver a ele de maneira “leve”. Não é prevenção de riscos psicossociais.", "f": ["maeno"]}], "nivelNome": "Para analisar o trabalho"}, {"id": "ordem", "publico": "aulas e formações; qualquer público", "nivel": "analisar", "tipo": "Ordenar", "nome": "Ponha em ordem", "curto": "Ponha em ordem", "dur": "6 min", "cor": "#34306B", "corEsc": "#B7B1F2", "desc": "A prioridade das medidas, as etapas do gerenciamento de riscos, a história dos riscos psicossociais e o caminho de uma decisão numa fábrica sob gestão operária. Toque nos itens na ordem certa.", "telas": [{"tipo": "ordenar", "tag": "NR-1 · prioridade das medidas", "p": "Ponha estas medidas da mais prioritária para a menos prioritária", "ops": ["Eliminar metas e prazos altamente exigentes", "Proteger denunciantes e notificar os transtornos mentais", "Negociar metas e prazos com a equipe", "Sala de descompressão e meditação"], "certa": [0, 1, 2, 3], "exp": "É a escada do item 1.4.1 da NR-1 aplicada pelas Diretrizes da Fundacentro: eliminação, proteção coletiva, organização do trabalho e, por último, proteção individual. A prioridade máxima é prevenir e proteger o coletivo, e toda medida deve ter relatório técnico que a justifique.", "f": ["nr1", "maeno"]}, {"tipo": "ordenar", "tag": "NR-1 · item 1.5.3.2", "p": "Ponha as etapas do gerenciamento de riscos na ordem", "ops": ["Identificar os perigos", "Avaliar os riscos", "Classificar os riscos para decidir as medidas", "Implementar as medidas de prevenção", "Acompanhar o controle dos riscos"], "certa": [0, 1, 2, 3, 4], "exp": "É a sequência do item 1.5.3.2 da NR-1, depois de evitar os riscos que podem ser evitados. As Diretrizes pedem que o Comitê Permanente de Organização do Trabalho e Saúde participe de todas as etapas, do inventário ao acompanhamento.", "f": ["nr1", "maeno"]}, {"tipo": "ordenar", "tag": "Linha do tempo", "p": "Ponha em ordem cronológica", "ops": ["Relatório da OMS sobre fatores psicossociais e saúde", "Comitê misto OIT/OMS define os fatores psicossociais no trabalho", "Primeira Lista de Doenças Relacionadas ao Trabalho", "Convenção 190 da OIT, sobre violência e assédio", "Portaria MTE 1.419 inclui os riscos psicossociais na NR-1"], "certa": [0, 1, 2, 3, 4], "exp": "1975, 1984 (com relatório publicado em 1986), 1999, 2019 e 2024. Os fatores psicossociais não são novidade nas normas brasileiras: já estavam no manual do Ministério da Saúde de 2001 e nas NR-17, 33, 35 e 37, lembram as Diretrizes.", "f": ["maeno"]}, {"tipo": "ordenar", "tag": "Níveis de prevenção", "p": "Ponha os níveis de ação na ordem, da fonte para o cuidado", "ops": ["Primário: identificar e agir sobre os fatores de risco", "Secundário: reduzir o sofrimento e apoiar quem adoece", "Terciário: cuidar do retorno depois do afastamento"], "certa": [0, 1, 2], "exp": "É o tripé que o Observatório retoma das diretrizes da OIT e da OMS de 2022. A avaliação de riscos é só a ponta do iceberg: o que previne de fato são intervenções organizacionais com participação ativa e representativa dos trabalhadores.", "f": ["obs"]}, {"tipo": "ordenar", "tag": "Gestão democrática", "p": "Na Flaskô, fábrica sob gestão operária, como subia uma questão até ser decidida?", "ops": ["O líder do setor", "O Conselho de Fábrica, eleito", "A assembleia de todos os trabalhadores"], "certa": [0, 1, 2], "exp": "O líder era procurado primeiro; se não resolvesse, a questão ia ao Conselho de Fábrica, que se reunia toda semana, e depois à assembleia mensal. Por quase 15 anos, a fábrica funcionou sem acidentes nem doenças relacionadas ao trabalho, relatam as Diretrizes: a democracia como mediadora da saúde e do poder de agir.", "f": ["maeno"]}], "nivelNome": "Para analisar o trabalho"}, {"id": "ideias", "publico": "formação teórica: graduação, pós e residências", "nivel": "analisar", "tipo": "Autores e conceitos", "nome": "Quem pensou isso? As raízes da STT, da SMRT e da PST", "curto": "Quem pensou isso?", "dur": "7 min", "cor": "#7A4A12", "corEsc": "#F0B05A", "desc": "De Le Guillant a Leny Sato, de Laurell a Clot: as ideias que ancoram a Saúde do Trabalhador, a Saúde Mental Relacionada ao Trabalho e a Psicologia Social do Trabalho, como aparecem nas Diretrizes da Fundacentro e no livro do Observatório.", "telas": [{"tipo": "escolha", "tag": "SMRT", "p": "Quem descreveu, em 1956, a “neurose das telefonistas”, em que quanto mais irritadas, mais rápidas elas ficavam?", "ops": ["Louis Le Guillant", "Christophe Dejours", "Yves Clot", "Georges Canguilhem"], "certa": 0, "exp": "Louis Le Guillant, da psicopatologia do trabalho. Dor de cabeça, insônia e fadiga nervosa apareciam como efeito do próprio trabalho e do controle, uma “doença necessária” à tarefa. Setenta anos depois, lembra o livro do Observatório, as condições não melhoraram.", "f": ["obsliv"]}, {"tipo": "escolha", "tag": "Medicina social latino-americana", "p": "Quem propôs ler o processo saúde-doença a partir do processo de produção e do desgaste operário?", "ops": ["Asa Cristina Laurell e Mariano Noriega", "Richard Lazarus e Susan Folkman", "Robert Karasek", "O comitê OIT/OMS de 1984"], "certa": 0, "exp": "Laurell e Noriega (1989) são base das Diretrizes da Fundacentro para tratar os riscos como processos. Lazarus e Folkman, ao contrário, estão na raiz do modelo do estresse, que, segundo as Diretrizes, tende a privilegiar os recursos individuais de enfrentamento.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "SMRT", "p": "“Trabalho e desgaste mental: o direito de ser dono de si mesmo” é obra de:", "ops": ["Edith Seligmann-Silva", "Leny Sato", "Maria Maeno", "Ricardo Antunes"], "certa": 0, "exp": "Edith Seligmann-Silva (2011), referência da Saúde Mental Relacionada ao Trabalho no Brasil. Para as Diretrizes, quando é impossível discutir e transformar o trabalho, as situações de risco levam ao desgaste, ao sofrimento e ao adoecimento.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Psicologia Social do Trabalho", "p": "Quem formulou os indícios de trabalho penoso, como o desrespeito ao limite subjetivo de quem trabalha?", "ops": ["Leny Sato", "Edith Seligmann-Silva", "Yves Clot", "Ivar Oddone"], "certa": 0, "exp": "Leny Sato, da Psicologia Social do Trabalho. Para prevenir o trabalho penoso, três requisitos em sinergia: participar do planejamento do trabalho, valorizar a familiaridade e a experiência, e respeitar o limite subjetivo.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Clínica da atividade", "p": "“Poder de agir”, “gênero profissional” e “trabalho bem feito” são conceitos de:", "ops": ["Yves Clot", "Louis Le Guillant", "Asa Cristina Laurell", "Ludmila Abílio"], "certa": 0, "exp": "Yves Clot. As Diretrizes leem com ele a experiência da Flaskô: os espaços de diálogo e decisão desenvolveram o gênero profissional e o poder de agir, e o trabalho passou a valer a pena.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Saúde do Trabalhador", "p": "A “comunidade científica ampliada”, que junta o saber do especialista e o do operário, vem de:", "ops": ["Ivar Oddone e a experiência operária italiana", "Frederick Taylor", "A ISO 45003", "A higiene ocupacional"], "certa": 0, "exp": "Ivar Oddone e colegas, a partir das lutas operárias italianas: o conhecimento sobre o trabalho e a saúde se constrói junto com quem trabalha. O livro do Observatório o cita na base do trabalho como produtor de saúde.", "f": ["obsliv"]}, {"tipo": "escolha", "tag": "Filosofia da saúde", "p": "Para quem a relação do ser humano com o meio é um “debate”, e não um reflexo mecânico?", "ops": ["Georges Canguilhem", "Frederick Taylor", "Hans Selye", "Robert Karasek"], "certa": 0, "exp": "Georges Canguilhem. O sujeito aprecia, interpreta e transforma o meio. As Diretrizes partem dessa ideia para recusar a visão dos “fatores” como substâncias autônomas que agem sobre pessoas passivas.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Saúde Coletiva", "p": "A cogestão, a gestão como espaço de produção de sujeitos e de decisão coletiva, vem da obra de:", "ops": ["Gastão Wagner de Sousa Campos", "Frederick Taylor", "Henri Fayol", "Hans Selye"], "certa": 0, "exp": "Gastão Wagner de Sousa Campos, da Saúde Coletiva brasileira. O livro do Observatório lembra que a democracia institucional não é enfeite: os espaços coletivos de decisão redistribuem a palavra, a responsabilidade e o poder, e protegem a saúde mental.", "f": ["obsliv"]}, {"tipo": "escolha", "tag": "Sociologia do trabalho", "p": "“Autogerenciamento subordinado”, a transferência de parte da gestão do trabalho para o próprio trabalhador, é conceito de:", "ops": ["Ludmila Abílio", "Leny Sato", "Edith Seligmann-Silva", "Christophe Dejours"], "certa": 0, "exp": "Ludmila Abílio, ao estudar a uberização. O livro do Observatório lembra o olhar interseccional: a profissão de entregador de bicicleta fica mais negra e mais jovem quando se uberiza.", "f": ["obsliv"]}, {"tipo": "escolha", "tag": "Gestão e subjetividade", "p": "De quem é a expressão “custo da excelência”, o custo psíquico da busca permanente por alto desempenho?", "ops": ["Nicole Aubert e Vincent de Gaulejac", "Yves Clot", "Leny Sato", "Asa Cristina Laurell"], "certa": 0, "exp": "Nicole Aubert e Vincent de Gaulejac. Avaliações rígidas pedem desempenho de atleta de alto rendimento, sempre crescente, e o “mediano” vira alvo de cobrança. É um dos indícios de trabalho penoso nas Diretrizes.", "f": ["maeno"]}], "nivelNome": "Para analisar o trabalho"}, {"id": "cuidado", "publico": "saúde, Cerest, RAPS, sindicatos e perícia", "nivel": "analisar", "tipo": "Perguntas", "nome": "Quando o trabalho já adoeceu: nexo, rede e direitos", "curto": "Quando o trabalho adoeceu", "dur": "8 min", "cor": "#8A2C4E", "corEsc": "#F59AB8", "desc": "LDRT, nexo, CAT, RAPS e Renastt, Cerest e matriciamento: a linha de cuidado em saúde mental para trabalhadores, com as propostas do Observatório e as Diretrizes da Fundacentro.", "telas": [{"tipo": "escolha", "tag": "LDRT", "p": "Na Lista de Doenças Relacionadas ao Trabalho atualizada em 2023 e 2024, os transtornos mentais passaram de 12 categorias para:", "ops": ["32 categorias", "15 categorias", "Nenhuma: saíram da lista", "100 categorias"], "certa": 0, "exp": "Entraram de forma explícita transtornos ansiosos e de adaptação, quadros psicóticos, uso de substâncias, transtornos somatoformes e lesões autoprovocadas, ligados a fatores psicossociais como gestão organizacional, jornada, assédio, discriminação e desemprego. O trabalho aparece como determinante, e não como cenário (livro do Observatório).", "f": ["obsliv", "ldrt"]}, {"tipo": "escolha", "tag": "Nexo", "p": "Existe instrumento capaz de separar o peso das características pessoais e o do trabalho num transtorno mental?", "ops": ["Não: os dois podem contribuir juntos, e o trabalho pode agravar um quadro anterior", "Sim: os testes de personalidade", "Sim: o exame admissional", "Sim: a pesquisa de clima"], "certa": 0, "exp": "Não existe, respondem as Diretrizes da Fundacentro (pergunta 8). Quando há aspectos da organização do trabalho previstos na NR-17 e indícios de trabalho penoso, há fundamento para reconhecer o papel do trabalho. O livro do Observatório critica a leitura linear da classificação de Schilling, que perde a complexidade do sofrimento.", "f": ["maeno", "obsliv"]}, {"tipo": "escolha", "tag": "Subnotificação", "p": "Por que o adoecimento mental relacionado ao trabalho é tão pouco reconhecido?", "ops": ["Pela dificuldade de estabelecer o nexo e porque empresas descaracterizam o sofrimento de origem laboral", "Porque quase ninguém adoece pelo trabalho", "Porque a lei proíbe notificar", "Porque o SUS não atende trabalhadores"], "certa": 0, "exp": "O livro do Observatório fala em subnotificação estrutural: a palavra do trabalhador é posta em dúvida por empregadores, perícias e até profissionais de saúde sem formação em Saúde do Trabalhador. Descaracterizar o adoecimento é, muitas vezes, estratégia para evitar responsabilização.", "f": ["obsliv"]}, {"tipo": "escolha", "tag": "CAT", "p": "A empresa se recusa a emitir a CAT de um transtorno mental relacionado ao trabalho. Quem mais pode emitir?", "ops": ["O próprio trabalhador, os dependentes, o sindicato, o médico que o atendeu ou uma autoridade pública", "Ninguém: só a empresa", "Só o médico do trabalho da empresa", "Só a Justiça do Trabalho"], "certa": 0, "exp": "É o que diz a Lei 8.213/1991 (art. 22, § 2º). Para as Diretrizes da Fundacentro, notificar, com a CAT ao INSS e no Sinan, garante direitos individuais e, quando a própria empresa notifica, é proteção coletiva.", "f": ["l8213", "maeno"]}, {"tipo": "escolha", "tag": "Rede do SUS", "p": "Na Rede de Atenção Psicossocial (RAPS), quem coordena o cuidado de quem adoeceu pelo trabalho?", "ops": ["Os profissionais de referência da RAPS, articulados com Cerest, vigilância e Previdência", "Só o médico do trabalho da empresa", "Só o INSS", "Ninguém: trabalho não é assunto da RAPS"], "certa": 0, "exp": "O livro do Observatório defende fortalecer a relação entre a RAPS e a Renastt, que são complementares: a RAPS coordena os projetos terapêuticos singulares, reconhece e notifica os transtornos e articula trabalho, previdência e outros setores. A pessoa trabalhadora é usuária da Atenção Primária.", "f": ["obsliv"]}, {"tipo": "escolha", "tag": "Matriciamento", "p": "Para que serve o apoio matricial entre a RAPS e os Cerest?", "ops": ["Discutir casos e atender junto: a RAPS aprende a ver o trabalho, e o Cerest, a saúde mental", "Transferir todos os casos para o Cerest", "Substituir o tratamento", "Medir a produtividade dos trabalhadores"], "certa": 0, "exp": "O matriciamento corresponsabiliza os serviços e amplia o repertório de cada um. A IV Oficina do Observatório o apontou como estratégia concreta de linha de cuidado, junto com a vigilância em saúde do trabalhador (Visat).", "f": ["obsliv"]}, {"tipo": "escolha", "tag": "Acesso", "p": "Que barreira a Diretriz 3 da IV Oficina do Observatório quer derrubar?", "ops": ["Serviços do SUS abertos no mesmo horário em que o trabalhador está trabalhando", "A falta de remédios", "O excesso de Cerest", "A notificação compulsória"], "certa": 0, "exp": "A proposta é ampliar o atendimento com modalidades presenciais e remotas e horários flexíveis, e criar Núcleos de Assistência à Saúde dos Trabalhadores onde não há Cerest. Cuidado que não cabe na jornada não chega a quem precisa.", "f": ["obsliv"]}, {"tipo": "escolha", "tag": "SMRT", "p": "O livro do Observatório propõe ler a depressão junto com qual categoria social?", "ops": ["Opressão", "Resiliência", "Vocação", "Produtividade"], "certa": 0, "exp": "Os pares são depressão e opressão, ideação suicida e ideação trabalhista, silenciamento e ocultamento, esgotamento e superexploração. Não substituem o diagnóstico: reinscrevem o sofrimento nas relações sociais de trabalho, mediadas pela organização do trabalho.", "f": ["obsliv"]}, {"tipo": "escolha", "tag": "Números", "p": "Quantos benefícios por incapacidade temporária por transtornos mentais a Previdência concedeu em 2025?", "ops": ["546.254", "54.625", "5.462", "1,5 milhão"], "certa": 0, "exp": "Foram 15,66% a mais que em 2024, segundo os dados citados no livro do Observatório. Na crítica à NR-1, o Observatório lembra que esses benefícios quase dobraram desde 2020 e já são 13,5% de todos os concedidos.", "f": ["obsliv", "inss", "obs"]}, {"tipo": "info", "cena": "retorno", "tag": "Apoio", "p": "Quando o trabalho já adoeceu", "txt": ["O Caminhos do Trabalho UFF, projeto de extensão coordenado por Bruno Chapadeiro em Volta Redonda (RJ), atende trabalhadores adoecidos: análise do nexo, CAT, orientação previdenciária e jurídica e acolhimento psicológico.", "Procure o projeto pelo WhatsApp ou pelo Instagram @caminhosdotrabalhouff. Em sofrimento agora? CVV, no 188, de graça e a qualquer hora."], "f": ["caminhos"]}], "nivelNome": "Para analisar o trabalho"}, {"id": "caso", "publico": "oficinas de SST, comitês e CIPAs", "nivel": "decidir", "tipo": "Caso e decisões", "nome": "Caso para decidir: a central que adoece", "curto": "Caso para decidir", "dur": "10 min", "cor": "#1F7F73", "corEsc": "#5FD3C2", "desc": "Um caso fictício em oito decisões, com as Diretrizes da Fundacentro e o Manual do MTE: quem conduz, que dados olhar, como classificar o risco, que medida vem primeiro, o que não é prevenção e quando reavaliar.", "telas": [{"tipo": "info", "cena": "tele", "tag": "O caso (fictício)", "p": "A central que adoece", "txt": ["Central de atendimento com 400 operadores. O sistema dita o ritmo das chamadas, o tempo médio é cronometrado, as pausas são controladas e a meta muda toda semana.", "Em um ano, 38 afastamentos por transtorno mental e 21 por doença osteomuscular, e só 2 CATs emitidas. Vocês decidem cada passo."], "f": []}, {"tipo": "escolha", "tag": "Passo 1", "p": "Quem conduz a avaliação dos riscos psicossociais?", "ops": ["Um comitê permanente com CIPA, trabalhadores, sindicato, SESMT e RH, com garantia de não retaliação", "Uma consultoria externa, sozinha", "O RH, com um questionário on-line", "A chefia de cada equipe"], "certa": 0, "exp": "É o Comitê Permanente de Organização do Trabalho e Saúde das Diretrizes da Fundacentro, com estabilidade igual à da CIPA para seus membros. A empresa não é obrigada a contratar especialistas; se contratar, a escolha passa pelo comitê. Sem democracia e sem garantia de não retaliação, o diagnóstico sai distorcido.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Passo 2", "p": "Que dados o comitê deve reunir?", "ops": ["Dados externos (INSS, MPT, Justiça), indícios de trabalho penoso e documentos da empresa, lidos com olhar crítico", "Só as CATs emitidas pela empresa", "Só uma pesquisa de clima", "Só os atestados de cada um"], "certa": 0, "exp": "São os três eixos das Diretrizes. Os documentos da empresa (PCMSO, PGR, CAT, afastamentos, eSocial) entram, mas com leitura crítica: só passaram pelo crivo da própria empresa. Aqui, 59 afastamentos e 2 CATs já dizem muito.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Passo 3", "p": "38 afastamentos por transtorno mental em um ano: como ler esse número?", "ops": ["Como evento sentinela: raramente é exceção e exige investigar o contexto de trabalho, com AET", "Como coincidência de casos individuais", "Como problema de saúde pessoal, fora do PGR", "Como nada, se não houve CAT"], "certa": 0, "exp": "Casos de transtorno mental numa organização dificilmente são eventos isolados, dizem as Diretrizes; alguns devem ser tratados como evento sentinela, com responsabilidade sanitária de investigar. A NR-17 pede AET quando a análise de doenças aponta causa nas condições de trabalho (item 17.3.2).", "f": ["maeno", "nr17"]}, {"tipo": "escolha", "tag": "Passo 4", "p": "Como estimar a severidade?", "ops": ["Pelo pior cenário: transtornos mentais podem levar à incapacidade permanente e ao suicídio", "Pelo cenário mais comum", "Pelo número de CATs", "Pelo custo das medidas"], "certa": 0, "exp": "“Sempre avaliar pelo pior cenário possível”, diz a regra de ouro do Manual do MTE. As Diretrizes concluem que a severidade dos riscos psicossociais deve ser a mais alta, sem usar o número de expostos ou o tempo de exposição para rebaixá-la.", "f": ["manual", "maeno"]}, {"tipo": "escolha", "tag": "Passo 5", "p": "E a probabilidade?", "ops": ["Análise qualitativa, com várias fontes: rotatividade, afastamentos, indícios, fiscalizações, notificações", "Baixa, porque só há 2 CATs", "Calculada pela prevalência de diagnósticos na empresa", "Média, por padrão"], "certa": 0, "exp": "Com só 2% dos benefícios por transtorno mental reconhecidos como ocupacionais em 2024, a CAT não é base para estimar probabilidade baixa. As Diretrizes propõem análise qualitativa dos potenciais de risco, com múltiplas fontes. Para fatores ergonômicos, incluindo os psicossociais, a NR-1 manda considerar as exigências da atividade e a eficácia das medidas (item 1.5.4.4.5.3).", "f": ["maeno", "manual"]}, {"tipo": "escolha", "tag": "Passo 6", "p": "Que medida vai primeiro no plano de ação?", "ops": ["Reprogramar o distribuidor de chamadas, negociar tempo médio e metas e dimensionar o efetivo", "Sala de descompressão com videogame", "Campanha do Setembro Amarelo", "Prêmio para quem não faltar"], "certa": 0, "exp": "Se uma máquina impõe o ritmo, só se diminui reprogramando a máquina, dizem as Diretrizes. O plano precisa de medidas estruturais e coletivas, com responsáveis, prazos e forma de acompanhar. Prêmio por assiduidade penaliza quem adoece e empurra para o presenteísmo.", "f": ["maeno", "nr1"]}, {"tipo": "escolha", "tag": "Passo 7", "p": "A diretoria quer registrar no PGR o programa de meditação e o canal de denúncia como medidas de prevenção. Procede?", "ops": ["Não: são proteção individual; podem existir, mas não substituem mudar o trabalho", "Sim: atingem todos, então são coletivas", "Sim, se tiverem boa adesão", "Sim, se forem terceirizadas"], "certa": 0, "exp": "Está na seção “O que não é prevenção” das Diretrizes: meditação, salas de descompressão, campanhas, apoio psicológico e canais focados em punir são proteção individual. Sem mudar as condições e a organização do trabalho, o adoecimento continua, e a responsabilidade vai para o trabalhador.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Passo 8", "p": "O inventário de riscos ficou pronto. E agora?", "ops": ["Validar com os trabalhadores e suas organizações e deixar o PGR à disposição deles e do sindicato", "Guardar como documento confidencial", "Mandar só para a fiscalização", "Revisar só daqui a dois anos, aconteça o que acontecer"], "certa": 0, "exp": "A NR-1 garante o acesso dos trabalhadores, dos sindicatos e da Inspeção aos documentos do PGR (item 1.5.7.2.1) e exige comunicar os riscos e as medidas (item 1.5.3.3). Para as Diretrizes, o inventário só vale se confirmado por quem trabalha, e mudanças ou mais afastamentos pedem reavaliação antes dos dois anos.", "f": ["nr1", "maeno"]}, {"tipo": "escolha", "tag": "Debate", "p": "Na sua opinião, a matriz de probabilidade × severidade serve para os riscos psicossociais?", "ops": ["Sim, como para os demais riscos", "Sim, com critérios qualitativos e a participação dos trabalhadores", "Não: esses riscos pedem outra lógica", "Não sei"], "certa": null, "exp": "Não há resposta certa: é o debate em curso. O Manual do MTE mantém a classificação de risco da NR-1 e admite avaliação qualitativa e participativa pela AEP. O Observatório critica encaixar esses riscos numa matriz quantitativa e defende uma norma própria. As Diretrizes da Fundacentro propõem severidade máxima e análise qualitativa dos potenciais de risco.", "f": ["manual", "obs", "maeno"]}], "nivelNome": "Para decidir e debater em grupo"}, {"id": "debate", "publico": "plenárias, sindicatos, conselhos e eventos", "nivel": "decidir", "tipo": "Votação aberta", "ao_vivo": true, "nome": "Plenária: vote e debata", "curto": "Plenária", "dur": "8 min", "cor": "#2E5E2A", "corEsc": "#8FD48A", "desc": "Seis polêmicas da NR-1 sem resposta certa. A sala vota, o telão mostra a divisão, e a explicação traz as posições do MTE, da Fundacentro e do Observatório.", "telas": [{"tipo": "escolha", "tag": "Norma própria?", "p": "Os riscos psicossociais deveriam ter uma NR própria?", "ops": ["Sim, uma norma só para eles", "Não: ficam na NR-1, com a NR-17", "Sim, sem tirá-los da NR-1", "Não sei"], "certa": null, "exp": "O Observatório defende uma NR própria, pela relevância e pelo impacto desses riscos. A NR-1 os incluiu no gerenciamento de riscos, nos termos da NR-17, e a proposta do MTE na AGU detalha a definição sem criar norma nova. As Diretrizes da Fundacentro trabalham com a NR-1 e a NR-17, somadas a outras normas, como a C190 e a LDRT.", "f": ["obs", "antep", "maeno"]}, {"tipo": "escolha", "tag": "Dentro da ergonomia?", "p": "Os fatores psicossociais devem ser tratados como parte dos riscos ergonômicos?", "ops": ["Sim: a NR-17 dá o caminho", "Não: é o contrário, a organização do trabalho produz os dois", "Depende do caso", "Não sei"], "certa": null, "exp": "A NR-1 os trata junto dos fatores ergonômicos, nos termos da NR-17. O Observatório diz que isso inverte a relevância: os fatores psicossociais são produzidos pela organização do trabalho e incluem os ergonômicos. As Diretrizes usam o item 17.4.1 da NR-17 como roteiro para analisar a organização do trabalho.", "f": ["nr1", "obs", "maeno"]}, {"tipo": "escolha", "tag": "Questionário?", "p": "Questionário padronizado é o melhor caminho para avaliar os riscos psicossociais?", "ops": ["Sim, se for validado", "Só junto com observação, grupos e participação", "Não: o caminho é a análise coletiva do trabalho", "Não sei"], "certa": null, "exp": "O MTE não exige ferramenta; se houver, precisa ser validada e aplicada por quem saiba interpretar. O Observatório recomenda instrumentos validados, com sigilo, completados por grupos focais e um comitê permanente. As Diretrizes alertam para questionários descolados da realidade da empresa e defendem o quantitativo e o qualitativo juntos, sempre com participação.", "f": ["manual", "obs", "maeno"]}, {"tipo": "escolha", "tag": "Quem avalia?", "p": "Quem deve conduzir a avaliação dos riscos psicossociais?", "ops": ["Especialistas contratados", "A equipe de SST, multiprofissional", "Um comitê de empresa e trabalhadores, com o sindicato", "Não sei"], "certa": null, "exp": "O MTE deixa a estratégia à organização e recomenda abordagem multidisciplinar. As Diretrizes não exigem especialista: propõem o Comitê Permanente de Organização do Trabalho e Saúde e dizem que nada substitui os trabalhadores da empresa. Psicólogas e psicólogos seguem a Resolução CFP 14/2023.", "f": ["manual", "maeno", "cfp"]}, {"tipo": "escolha", "tag": "Selos", "p": "Selos de “empresa promotora da saúde mental” ajudam a prevenir?", "ops": ["Sim, estimulam boas práticas", "Só com critérios rigorosos e participação dos trabalhadores", "Não: viram propaganda", "Não sei"], "certa": null, "exp": "Na IV Oficina, o Observatório decidiu divulgar nota crítica à certificação: critérios frouxos podem premiar empresas que ignoram a organização do trabalho. As Diretrizes lembram que o selo não dispensa a NR-1 e que certificação não significa baixo risco.", "f": ["obsliv", "maeno"]}, {"tipo": "escolha", "tag": "Canal de denúncia", "p": "O canal de denúncia da empresa protege quem denuncia assédio?", "ops": ["Sim, na maioria das vezes", "Só com investigação transparente, anonimato e participação dos trabalhadores", "Não: costuma expor quem denuncia", "Não sei"], "certa": null, "exp": "Para as Diretrizes, o canal é proteção individual, e não prevenção. Para ganhar confiança, precisa de protocolo de investigação, aval da alta direção, política transparente, anonimato total e participação de representantes dos trabalhadores, além de proteção contra a demissão de vítimas e testemunhas.", "f": ["maeno"]}, {"tipo": "nuvem", "tag": "A vez da sala", "p": "Em uma palavra: o que falta para a NR-1 funcionar de verdade?", "ex": "ex.: participação", "exp": "As palavras da sala são o começo de uma pauta para a CIPA, o sindicato ou o comitê.", "f": []}, {"tipo": "info", "tag": "Participe", "p": "Leve o debate adiante", "txt": ["Até 2/12/2026, qualquer pessoa ou entidade pode mandar sugestões à AGU sobre os riscos psicossociais na NR-1 e sobre a proposta do MTE (Tomada de Subsídios nº 3/2026).", "O passo a passo está na página dos jogos, em “Em que pé está a NR-1”."], "f": ["agu"]}], "nivelNome": "Para decidir e debater em grupo"}, {"id": "termometro", "publico": "equipes de trabalho, CIPAs e assembleias", "nivel": "decidir", "tipo": "Ao vivo e anônimo", "ao_vivo": true, "nome": "Termômetro do coletivo", "curto": "Termômetro", "dur": "10 min", "cor": "#C2410C", "corEsc": "#FDBA74", "desc": "Uma roda de conversa no telão, anônima: pausas, metas, ritmo, desconexão, valores e apoio, a partir dos indícios de trabalho penoso. Não é diagnóstico: é o ponto de partida do coletivo.", "telas": [{"tipo": "info", "cena": "roda", "tag": "Antes de começar", "p": "Um retrato rápido, sem nome de ninguém", "txt": ["As respostas são anônimas: ninguém vê quem respondeu o quê, e o telão só mostra cada resultado a partir de 5 respostas.", "Não é diagnóstico nem a avaliação de riscos da NR-1. É um retrato do grupo para abrir a conversa: o que se repete é do coletivo."], "f": ["maeno"]}, {"tipo": "nuvem", "tag": "Nuvem de palavras", "p": "Em uma palavra: o que mais pesa no seu trabalho hoje?", "ex": "ex.: metas", "exp": "Palavras que se repetem mostram o que é do coletivo, e não de uma pessoa só. É por aí que começa a análise do trabalho real.", "f": []}, {"tipo": "escala", "tag": "Pausas", "p": "Você consegue fazer pausas quando precisa, inclusive para ir ao banheiro?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Restringir pausas para necessidades fisiológicas é prática violenta naturalizada e indício de trabalho penoso, dizem as Diretrizes da Fundacentro. Não basta haver banheiro: é preciso haver condições para a pausa.", "f": ["maeno"]}, {"tipo": "escala", "tag": "Participação", "p": "Você participa da definição das metas e dos prazos do seu trabalho?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Participar do planejamento do trabalho é o primeiro dos três requisitos de Leny Sato para prevenir o trabalho penoso. Metas impostas sem participação ignoram as potencialidades e os limites de quem trabalha.", "f": ["maeno"]}, {"tipo": "escala", "tag": "Experiência", "p": "Sua experiência é levada em conta quando o trabalho muda?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Valorizar a familiaridade e a experiência na tarefa é o segundo requisito. O saber acumulado no corpo e no coletivo costuma ser ignorado, quando não reprimido.", "f": ["maeno"]}, {"tipo": "escala", "tag": "Limite", "p": "Dá para trabalhar no seu ritmo, respeitando os limites do corpo e da cabeça?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "O terceiro requisito é respeitar o limite subjetivo: quando, quanto e como cada um suporta as demandas. Às vezes o desrespeito vem por sedução, com metas e prêmios, e parece autonomia.", "f": ["maeno"]}, {"tipo": "escala", "tag": "Desconexão", "p": "Você consegue se desconectar do trabalho nas folgas e nas férias?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Não poder se desconectar é outra violência organizacional naturalizada. O hiperengajamento impede o descanso e a reflexão sobre o que está acontecendo.", "f": ["maeno"]}, {"tipo": "escala", "tag": "Valores", "p": "Você já teve de fazer algo contra seus valores, ou um trabalho malfeito por falta de condições?", "ops": ["Nunca", "Uma vez", "Algumas vezes", "Muitas vezes"], "alerta": [1, 2, 3], "exp": "Conflito de valores e qualidade impedida geram sofrimento, segundo as Diretrizes. Quando a tarefa afronta a ética do ofício, a análise não é “subjetiva” e deve envolver a representação dos trabalhadores.", "f": ["maeno"]}, {"tipo": "escala", "tag": "Competição", "p": "No seu trabalho há ranking, exposição ou avaliação que põe colega contra colega?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [2, 3], "exp": "Avaliações que estimulam a competição enfraquecem a cooperação, que protege a saúde. Ranqueamento e exposição pública estão entre as violências naturalizadas.", "f": ["maeno"]}, {"tipo": "escala", "tag": "Apoio", "p": "Quando aperta, você tem com quem contar no trabalho?", "ops": ["Nunca", "Às vezes", "Muitas vezes", "Sempre"], "alerta": [0, 1], "exp": "Redes de colaboração e solidariedade são processos de proteção; o isolamento e a falta de rede de apoio intensificam o desgaste.", "f": ["maeno"]}, {"tipo": "escolha", "tag": "Quem muda", "p": "Com quem levar este retrato adiante?", "ops": ["Um comitê de trabalhadores e empresa, com CIPA e sindicato", "Só a chefia", "Só o RH", "Uma consultoria de fora"], "certa": 0, "exp": "Os representantes dos trabalhadores devem participar de todas as etapas (Diretrizes, pergunta 11), e a NR-1 exige mecanismos de participação e consulta (item 1.
