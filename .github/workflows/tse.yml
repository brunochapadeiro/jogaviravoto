# Diagnóstico: confere os arquivos públicos de resultados do TSE (só leitura, sem segredo nenhum).
name: Conferir TSE
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Endereços separados por espaço (relativos a /oficial/ ou completos)"
        required: false
        default: ""
      grep:
        description: "Expressão para procurar no conteúdo (opcional)"
        required: false
        default: ""
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - name: Ler arquivos do TSE
        env:
          URLS: ${{ inputs.urls }}
          GREP: ${{ inputs.grep }}
        run: |
          B=https://resultados.tse.jus.br/oficial
          echo "::notice title=CORS::$(curl -sS -I -H 'Origin: https://jogaviravoto.brunochapadeiro.workers.dev' "$B/ele2026/6257/dados/br/br-c0001-e006257-u.json" | tr '\r\n' '  ' | cut -c1-1500)"
          for U in $URLS; do
            case "$U" in http*) ;; *) U="$B/$U";; esac
            C=$(curl -sS -A "Mozilla/5.0" --compressed --max-time 20 -o /tmp/r.json -w "%{http_code}" "$U" || echo ERR)
            S=$(wc -c < /tmp/r.json)
            H=$(head -c 2500 /tmp/r.json 2>/dev/null | tr '\n\r' '  ' | sed 's/::/ : /g')
            echo "::notice title=$C ${S}b $(echo "$U" | sed 's#.*/oficial/##')::$H"
            T=$(tail -c 2500 /tmp/r.json 2>/dev/null | tr '\n\r' '  ' | sed 's/::/ : /g')
            echo "::notice title=FIM $(basename "$U")::$T"
            if [ -n "$GREP" ]; then G=$(grep -oE ".{0,90}($GREP).{0,90}" /tmp/r.json | head -40 | tr '\n\r' '  ' | sed 's/::/ : /g' | cut -c1-3800); echo "::notice title=GREP $(basename "$U")::$G"; fi
          done
