# Plano B para publicar o site no Cloudflare a cada envio para a branch main.
# Só funciona depois de cadastrar, no GitHub (Settings > Secrets and variables > Actions),
# os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. Sem eles, nada é publicado e nada dá erro.
name: Publicar no Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Sem chave do Cloudflare, sem publicação
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. Nada foi publicado."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 20
      - name: Publicar o Worker jogaviravoto
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.147.0 deploy
